* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --vh: 100vh;
  --mono: "VT323", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --hand: "Noteworthy", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
  --fs: 22px;
  --wall: #2b1e15;
  --wall2: #1c130d;
}

/* ---------- phosphor themes ---------- */
body, body[data-theme="amber"] {
  --bg: #150b04; --bg2: #1f1207;
  --fg: #f4b36a; --hi: #ffe4b8; --dim: #9b6a3c; --acc: #ff9466;
  --ok: #c4dc7c; --warn: #ff7766; --sky: #8fc8e8; --glow: rgba(255, 166, 77, .55);
  --scan: rgba(0, 0, 0, .22); --sel: rgba(255, 180, 106, .25);
}
body[data-theme="green"] {
  --bg: #04100a; --bg2: #071a0f;
  --fg: #7ff09a; --hi: #d4ffdc; --dim: #3f8a55; --acc: #c7f56b;
  --ok: #9dffb8; --warn: #ffb36b; --sky: #8fe8d6; --glow: rgba(110, 255, 150, .5);
  --scan: rgba(0, 0, 0, .26); --sel: rgba(127, 240, 154, .22);
}
body[data-theme="paper"] {
  --bg: #efe4cc; --bg2: #e6d8bb;
  --fg: #3d2f22; --hi: #1c140c; --dim: #8b7558; --acc: #b5502c;
  --ok: #4f7a2a; --warn: #b23a2a; --sky: #2f6c8c; --glow: rgba(0, 0, 0, 0);
  --scan: rgba(80, 50, 20, .05); --sel: rgba(181, 80, 44, .18);
}
body[data-theme="rose"] {
  --bg: #170a10; --bg2: #220f18;
  --fg: #f5a9bd; --hi: #ffe1ea; --dim: #9c5d70; --acc: #ffc27a;
  --ok: #bfe3a0; --warn: #ff7f7f; --sky: #b9c6ff; --glow: rgba(255, 140, 175, .5);
  --scan: rgba(0, 0, 0, .22); --sel: rgba(245, 169, 189, .22);
}
body[data-theme="frost"] {
  --bg: #07101c; --bg2: #0b1828;
  --fg: #a8d4ff; --hi: #eef7ff; --dim: #5677a0; --acc: #ffd38a;
  --ok: #a6f0d0; --warn: #ff9a8a; --sky: #d2e6ff; --glow: rgba(140, 200, 255, .5);
  --scan: rgba(0, 0, 0, .24); --sel: rgba(168, 212, 255, .22);
}

html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--mono);
  background:
    radial-gradient(70% 60% at 18% 8%, rgba(255, 190, 120, .16), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 3px, transparent 3px 140px),
    linear-gradient(180deg, var(--wall), var(--wall2));
  color: var(--fg);
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}

/* ---------- layout ---------- */
#app {
  position: fixed; left: 0; top: 0; width: 100%; height: var(--vh);
  display: flex; gap: 18px;
  padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
#side { flex: 0 0 min(30%, 340px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#monitor { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* the window: a pixel-art canvas in a wooden frame */
#win {
  position: relative; flex: 0 0 auto; aspect-ratio: 4 / 4.4; border-radius: 6px;
  padding: 10px; background: linear-gradient(160deg, #6b4a2f, #4a3220);
  box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.3);
}
#scene { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 2px; background: #0b1020; }
#win::after { /* window cross bars */
  content: ""; position: absolute; inset: 10px; pointer-events: none;
  background:
    linear-gradient(90deg, transparent calc(50% - 3px), #4a3220 calc(50% - 3px), #5b3d27 calc(50% + 3px), transparent calc(50% + 3px)),
    linear-gradient(180deg, transparent calc(46% - 3px), #4a3220 calc(46% - 3px), #5b3d27 calc(46% + 3px), transparent calc(46% + 3px));
  box-shadow: inset 0 0 18px rgba(0,0,0,.35);
}

/* the paper card under the window */
#card {
  position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
  padding: 16px 18px 14px; border-radius: 3px;
  background: linear-gradient(180deg, #f3e7cd, #e9d9b8);
  color: #3a2b1d; font-family: var(--mono); font-size: 21px; line-height: 1.12;
  box-shadow: 0 10px 24px rgba(0,0,0,.4); transform: rotate(-.6deg);
}
#card::before { /* tape */
  content: ""; position: absolute; top: -8px; left: 50%; width: 86px; height: 22px; transform: translateX(-50%) rotate(2deg);
  background: rgba(255, 245, 210, .55); box-shadow: 0 1px 2px rgba(0,0,0,.15);
}
#card .ttl { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #8a6b4a; margin-bottom: 4px; }
#card .big { font-size: 34px; color: #2a1d12; line-height: 1; }
#card .row { display: flex; justify-content: space-between; gap: 8px; }
#card .sep { border-top: 1px dashed rgba(90, 60, 30, .3); margin: 9px 0 8px; }
#card .meter { height: 10px; border: 2px solid #3a2b1d; margin-top: 4px; background: rgba(0,0,0,.05); }
#card .meter i { display: block; height: 100%; background: repeating-linear-gradient(90deg, #c8643b 0 6px, #d9784d 6px 8px); transition: width .6s ease; }
#card .note { font-family: var(--hand); font-size: 15px; color: #6a4a2c; margin-top: 8px; line-height: 1.3; }
#card .pk { color: #6f5438; font-size: 18px; }

/* ---------- the monitor ---------- */
#bezel {
  position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  padding: 26px 28px 40px; border-radius: 26px 26px 20px 20px;
  background: linear-gradient(170deg, #e7dcc4 0%, #d6c8aa 55%, #c4b495 100%);
  box-shadow:
    0 18px 40px rgba(0,0,0,.55),
    inset 0 2px 0 rgba(255,255,255,.6),
    inset 0 -6px 0 rgba(0,0,0,.12),
    inset 6px 0 12px rgba(255,255,255,.15);
}
#bezel .brand {
  position: absolute; left: 32px; bottom: 11px; font-size: 17px; letter-spacing: 3px; color: #7d6c51;
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
}
#bezel .brand b { color: #b2552e; }
#bezel .vents { position: absolute; right: 86px; bottom: 15px; width: 90px; height: 10px;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 4px, transparent 4px 9px); border-radius: 2px; }
#led {
  position: absolute; right: 34px; bottom: 14px; width: 12px; height: 12px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #d6ff9c, #59c241 60%, #2e7a22);
  box-shadow: 0 0 10px #7dff5c, 0 0 2px #7dff5c;
}
#led.busy { animation: blink .18s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* sticky note on the bezel */
#postit {
  position: absolute; bottom: -22px; right: -12px; z-index: 4; width: 128px; min-height: 92px; padding: 12px 11px 10px;
  background: linear-gradient(180deg, #fff3a3, #f6e27d); color: #4b3a12;
  font-family: var(--hand); font-size: 14px; line-height: 1.25;
  transform: rotate(4deg); box-shadow: 0 8px 14px rgba(0,0,0,.3);
  cursor: pointer; transition: transform .25s ease;
}
#postit:active { transform: rotate(1deg) scale(.98); }
#postit.gone { display: none; }

#screen {
  position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
  border-radius: 22px / 18px;
  background: radial-gradient(130% 120% at 50% 45%, var(--bg2), var(--bg) 70%);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.65), inset 0 0 40px rgba(0,0,0,.75), 0 0 0 7px #a99a7c, 0 0 0 9px #8f8064;
}
#term {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding: 22px 26px 26px; font-size: var(--fs); line-height: 1.16;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none;
  text-shadow: 0 0 6px var(--glow), 0 0 1px var(--glow);
  animation: flicker 6s infinite steps(60);
}
#term::-webkit-scrollbar { display: none; }
@keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: .985; } 48% { opacity: .96; } 49% { opacity: 1; } }
body[data-theme="paper"] #term { animation: none; }

#out { white-space: pre-wrap; word-break: break-word; }
#out .ln { min-height: 1.16em; animation: in .18s ease-out both; }
@keyframes in { from { opacity: 0; transform: translateY(2px); filter: blur(1px); } to { opacity: 1; transform: none; filter: none; } }
.echo { color: var(--dim); }
.echo .p { color: var(--dim); }

/* markup colours */
.hi { color: var(--hi); }
.dim { color: var(--dim); }
.acc { color: var(--acc); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.sky { color: var(--sky); }
.u { text-decoration: underline; text-underline-offset: 3px; }
.big { font-size: 1.6em; line-height: 1.05; }
.cmd {
  color: var(--hi); cursor: pointer; border-bottom: 1px dashed var(--dim);
  padding: 0 1px; border-radius: 2px; transition: background .15s;
}
.cmd:hover, .cmd:active { background: var(--sel); }

/* input line */
#line { display: flex; white-space: pre; position: relative; min-height: 1.2em; }
#line.hide { visibility: hidden; height: 0; min-height: 0; }
#prompt { color: var(--acc); flex: none; }
#mirror { color: var(--hi); white-space: pre-wrap; word-break: break-all; flex: 1 1 auto; min-width: 0; }
#mirror .cur { background: var(--fg); color: var(--bg); box-shadow: 0 0 8px var(--glow); animation: cur 1.05s steps(1) infinite; }
#mirror .cur.idle { animation: cur 1.05s steps(1) infinite; }
@keyframes cur { 50% { background: transparent; color: var(--hi); box-shadow: none; } }
#mirror .ghost { color: var(--dim); opacity: .7; }
#cmd {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; /* 16px = no iOS zoom */
  border: 0; outline: 0; background: transparent; color: transparent; caret-color: transparent;
}

/* CRT overlays */
.scan { position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(180deg, var(--scan) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
.glass { position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: inherit;
  background:
    radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.07), transparent 45%),
    radial-gradient(140% 140% at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%); }
body[data-theme="paper"] .glass { background: radial-gradient(140% 140% at 50% 50%, transparent 62%, rgba(80,50,20,.25) 100%); }
#screen.off #term { opacity: 0; }
#screen.boot #term { animation: crton .5s ease-out both; }
@keyframes crton { 0% { transform: scale(1, .004); filter: brightness(4); } 45% { transform: scale(1, .004); } 100% { transform: none; filter: none; } }

/* ---------- keycap shortcuts ---------- */
#keys { flex: none; display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 6px 2px; justify-content: center; min-height: 52px; }
#keys.hide { display: none; }
.key {
  font-family: var(--mono); font-size: 19px; line-height: 1; color: #3b3022;
  padding: 7px 12px 8px; border-radius: 7px; border: 0; cursor: pointer;
  background: linear-gradient(180deg, #f1e8d4, #dccfb2);
  box-shadow: 0 4px 0 #a39271, 0 5px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.7);
  transition: transform .06s, box-shadow .06s;
}
.key:active, .key.press { transform: translateY(3px); box-shadow: 0 1px 0 #a39271, 0 2px 4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.7); }
.key.fn { background: linear-gradient(180deg, #e1a98a, #c98564); color: #3a1c0e; box-shadow: 0 4px 0 #8f5438, 0 5px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5); }
.key.fn:active { box-shadow: 0 1px 0 #8f5438; }

/* ---------- toast (achievements, mail) ---------- */
#toast {
  position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top)); z-index: 30;
  transform: translate(-50%, -220%); opacity: 0; transition: transform .45s cubic-bezier(.2, 1.4, .4, 1), opacity .3s;
  padding: 10px 16px 9px; border-radius: 3px; max-width: 86vw;
  background: #f6eed9; color: #3a2b1d; font-size: 20px; box-shadow: 0 10px 24px rgba(0,0,0,.45);
}
#toast.show { transform: translate(-50%, 0) rotate(-1deg); opacity: 1; }
#toast b { color: #b2552e; font-weight: normal; }

/* ---------- small / portrait screens ---------- */
@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  #app { flex-direction: column; gap: 10px; }
  #side { flex: 0 0 auto; flex-direction: row; height: 21%; min-height: 120px; gap: 10px; }
  #win { aspect-ratio: auto; flex: 1 1 60%; padding: 7px; }
  #win::after { inset: 7px; }
  #card { flex: 1 1 40%; font-size: 18px; padding: 10px 12px; }
  #card .big { font-size: 26px; }
  #card .note, #card .pk.opt { display: none; }
  #bezel { padding: 16px 14px 34px; border-radius: 18px; }
  #postit { width: 104px; min-height: 64px; font-size: 11.5px; right: -6px; bottom: -8px; padding: 8px; }
  #term { padding: 16px 16px 18px; }
  .key { font-size: 17px; padding: 6px 10px 7px; }
}
@media (max-width: 520px) {
  :root { --fs: 19px; }
  #side { height: 17%; }
  #card { display: none; }
  #postit { display: none; }
  #bezel .vents { display: none; }
  #bezel .brand i { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #term, #out .ln { animation: none !important; }
}
.s { text-decoration: line-through; opacity: .65; }
.fg { color: var(--fg); }
#win.outside::after { display: none; }

</div>
<div id="toast"></div>
<script>
/* ---- js/00-util.js ---- */
/* =====================================================================
   00-util.js — small helpers everyone uses.
   ===================================================================== */
"use strict";

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pad = (s, n, ch = " ") => { s = String(s); while (s.length < n) s += ch; return s; };
const padL = (s, n, ch = " ") => { s = String(s); while (s.length < n) s = ch + s; return s; };
const cap = s => (s ? s[0].toUpperCase() + s.slice(1) : s);
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));

/** Deterministic pseudo-random from a seed (mulberry32). Same day -> same weather. */
function seeded(seed) {
  let t = seed >>> 0;
  return () => {
    t += 0x6d2b79f5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

/** Escape anything the player typed before it goes near innerHTML. */
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\{/g, "&#123;").replace(/\}/g, "&#125;");
}

/** Strip our {tag:text} markup, for pipes and grep. */
function plain(s) {
  let prev;
  s = String(s);
  do { prev = s; s = s.replace(/\{(\w+):([^{}]*)\}/g, "$2"); } while (s !== prev);
  return s.replace(/&#123;/g, "{").replace(/&#125;/g, "}").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
}

/** Levenshtein distance — for "did you mean ...?" */
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function closest(word, list, max = 2) {
  let best = null, bd = 99;
  for (const w of list) { const d = lev(word, w); if (d < bd) { bd = d; best = w; } }
  return bd <= max ? best : null;
}

/** 7:05 -> "7:05am". Minutes since midnight in, string out. */
function clock(min) {
  min = ((Math.floor(min) % 1440) + 1440) % 1440;
  let h = Math.floor(min / 60), m = min % 60;
  const ap = h < 12 ? "am" : "pm";
  h = h % 12 || 12;
  return h + ":" + padL(m, 2, "0") + ap;
}

/** Split a command line into words, respecting "quotes" and 'quotes'. */
function words(line) {
  const out = []; let cur = "", q = null, had = false;
  for (const ch of line) {
    if (q) { if (ch === q) q = null; else cur += ch; continue; }
    if (ch === '"' || ch === "'") { q = ch; had = true; continue; }
    if (/\s/.test(ch)) { if (cur || had) out.push(cur); cur = ""; had = false; continue; }
    cur += ch;
  }
  if (cur || had) out.push(cur);
  return out;
}

const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---- js/01-state.js ---- */
/* =====================================================================
   01-state.js — the save file. Everything that should survive closing
   the app lives in S. Everything else is allowed to forget.
   ===================================================================== */
"use strict";

const SAVE_KEY = "hearth.save.v1";
const START_MIN = 7 * 60;        // every day starts at 7:00am
const SEASON_END = 14;           // Lantern Night

function newState() {
  return {
    v: 1,
    name: "",
    day: 1,
    min: START_MIN,            // minutes since midnight
    cwd: "/cottage",
    prevCwd: "/cottage",
    warmth: 55,                // 0..100, how cosy you feel
    fireUntil: 0,              // absolute minute the stove burns out
    teaAt: -9999,              // absolute minute the last tea was brewed
    teaKind: null,
    inv: { "seed:mint": 3, "seed:carrot": 2 },
    plots: Array.from({ length: 6 }, () => ({ crop: null, age: 0, wet: false })),
    gh: Array.from({ length: 3 }, () => ({ crop: null, age: 0, wet: false })),
    flags: {},                 // story switches: anything boolean goes here
    disks: {},                 // radio, sky, lantern, pip
    taken: {},                 // paths of things you picked up
    files: {},                 // files YOU wrote: path -> text
    read: {},                  // paths you've cat'ed
    recipes: {},
    fishlog: {},               // species -> { n, best }
    stars: {},                 // constellations found
    friends: { ottoline: 0, fenn: 0, pip: 0, juniper: 0 },
    mailbox: [],               // unread letter ids
    letters: [],               // every letter id you've received
    outbox: [],                // { to, item, day }
    dyn: {},                   // replies people wrote you: id -> letter
    quests: {},                // id -> "open" | "done"
    aliases: {},
    hist: [],
    theme: "amber",
    sound: true,
    keys: true,
    cat: { room: "parlour", mood: 60, fed: 0, petsToday: 0 },
    fox: null,                 // name you gave the fox
    keeps: {},                 // keepsakes (achievements) -> day found
    clues: {},                 // the corkboard: clue id -> day pinned
    journal: [],               // [{ day, text }]
    today: [],                 // events that become tonight's journal entry
    stats: { cmds: 0, teas: 0, fish: 0, harvests: 0, pets: 0, letters: 0, gifts: 0, meals: 0, days: 1 },
    wood: 3,
    ended: false,
    created: Date.now()
  };
}

let S = newState();

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* private mode: we'll live */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const got = JSON.parse(raw);
    S = Object.assign(newState(), got);
    // merge nested defaults so old saves don't explode when we add things
    const d = newState();
    for (const k of ["flags", "friends", "stats", "cat", "clues"]) S[k] = Object.assign({}, d[k], got[k] || {});
    return true;
  } catch (e) { return false; }
}
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = newState(); }

/** Absolute time in minutes since the very first morning. */
const now = () => S.day * 1440 + S.min;

/** Inventory helpers. Keys are like "carrot", "seed:mint", "fish:perch". */
const has = (k, n = 1) => (S.inv[k] || 0) >= n;
function give(k, n = 1) { S.inv[k] = (S.inv[k] || 0) + n; }
function take(k, n = 1) {
  if (!has(k, n)) return false;
  S.inv[k] -= n; if (S.inv[k] <= 0) delete S.inv[k];
  return true;
}

/** Remember something for tonight's journal entry. */
function remember(line) { if (!S.today.includes(line)) S.today.push(line); }

/** Keepsakes: little things that go in the jar on the windowsill. */
const KEEPSAKES = {
  first_tea:   ["a tea-stained spoon", "brewed your first cup"],
  first_fish:  ["a perch scale, shiny", "caught your first fish"],
  first_plant: ["a muddy seed packet", "planted something"],
  first_harv:  ["a carrot top", "harvested your first crop"],
  pet10:       ["a tuft of orange fur", "petted Biscuit ten times"],
  marmalade:   ["a golden scale the size of a coin", "caught Old Marmalade"],
  radio:       ["a radio dial knob", "got the radio working"],
  allstars:    ["a hand-drawn star chart", "found every constellation"],
  comet:       ["a pencil sketch of a comet", "saw Wren's Comet"],
  bottle:      ["a message in a bottle", "fished up a bottle"],
  baker:       ["a flour handprint", "cooked five meals"],
  friend:      ["a pressed flower", "became dear friends with someone"],
  allfriends:  ["a village photograph", "befriended the whole Hollow"],
  fox:         ["a fox whisker (you think)", "named the fox"],
  lantern:     ["a lantern wick, burned down", "lit the lantern on Lantern Night"],
  answered:    ["a scale of light, which fades if you look straight at it", "answered it"],
  writer:      ["a pencil stub", "wrote your own file"],
  sudo:        ["a sandwich crust", "used sudo for good"],
  night_owl:   ["a moth", "stayed up past 1am"],
  greenhouse:  ["a rusty hinge", "opened the greenhouse"],
  attic:       ["a dusty photograph", "explored the attic"],
  fishall:     ["a laminated fish poster", "caught every kind of fish"],
  hacker:      ["a tiny paper crown", "used a pipe |"],
  bookworm:    ["a bookmark", "read every book on the shelf"]
};
function keepsake(id) {
  if (S.keeps[id] || !KEEPSAKES[id]) return;
  S.keeps[id] = S.day;
  toast("into the jar: <b>" + KEEPSAKES[id][0] + "</b>");
  sfx("chime");
  if (Object.keys(S.keeps).length === Object.keys(KEEPSAKES).length) setTimeout(() => toast("the jar is full. <b>you should be very proud.</b>"), 3500);
}

let toastT = 0;
function toast(html) {
  const t = $("toast"); if (!t) return;
  t.innerHTML = html; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3200);
}

/* ---- js/02-term.js ---- */
/* =====================================================================
   02-term.js — the terminal itself: printing, the prompt, typing,
   history, tab-completion, little fish-shell style ghost suggestions,
   and the keycap row under the screen.

   Markup you can use in any printed string:
     {hi:bright}  {dim:quiet}  {acc:accent}  {ok:green-ish}  {warn:red-ish}
     {sky:blue}   {u:underline} {big:large}
     {cmd:ls -a}  -> a tappable command (runs when clicked)
   Tags nest:  {dim:try {cmd:look}}
   ===================================================================== */
"use strict";

const T = {
  busy: false,
  skip: false,          // set by ctrl+c / taps to fast-forward animations
  cap: null,            // when piping, output is captured here instead
  asking: null,         // { resolve, prompt, secret }
  keyWait: null,        // resolve fn for awaitKey()
  histPos: -1,
  draft: "",
  maxLines: 700
};

/** markup + html -> the text a pipe should see */
const toPlain = s => plain(String(s).replace(/<[^>]+>/g, ""));

function fmt(s) {
  s = String(s);
  let prev;
  do {
    prev = s;
    s = s.replace(/\{(\w+):([^{}]*)\}/g, (all, tag, body) => {
      if (tag === "cmd") {
        const c = plain(body).replace(/"/g, "&quot;");
        return '<span class="cmd" data-c="' + c + '">' + body + "</span>";
      }
      return '<span class="' + tag + '">' + body + "</span>";
    });
  } while (s !== prev);
  return s;
}

/** Print one or more lines. Strings may contain \n and markup. */
function print(...parts) {
  const text = parts.join(" ");
  if (T.cap) { for (const l of String(text).split("\n")) T.cap.push(toPlain(l)); return; }
  const out = $("out");
  for (const l of String(text).split("\n")) {
    const d = document.createElement("div");
    d.className = "ln";
    d.innerHTML = fmt(l) || "&nbsp;";
    out.appendChild(d);
  }
  trimOut();
  scrollDown();
}
function blank() { print(""); }
function printRaw(html, cls) {
  if (T.cap) { T.cap.push(toPlain(html)); return; }
  const d = document.createElement("div");
  d.className = "ln" + (cls ? " " + cls : "");
  d.innerHTML = html;
  $("out").appendChild(d);
  trimOut(); scrollDown();
  return d;
}
function trimOut() {
  const out = $("out");
  while (out.childElementCount > T.maxLines) out.removeChild(out.firstChild);
}
function scrollDown() {
  const t = $("term");
  if (t) requestAnimationFrame(() => { t.scrollTop = t.scrollHeight; });
}
function clearScreen() { $("out").innerHTML = ""; }

/** A pause that ctrl+c / a tap can skip. */
async function pause(ms) {
  if (T.skip || T.cap) return;
  const step = 40;
  for (let t = 0; t < ms; t += step) { if (T.skip) return; await wait(Math.min(step, ms - t)); }
}

/** Typewriter: prints one line a character at a time. */
async function type(text, cps = 55, cls) {
  if (T.cap || T.skip) { print(cls ? "{" + cls + ":" + text + "}" : text); return; }
  const d = printRaw("", cls);
  const chars = [...plain(text)];
  let shown = "";
  for (let i = 0; i < chars.length; i++) {
    if (T.skip) { d.innerHTML = fmt(text); scrollDown(); return; }
    shown += chars[i];
    d.textContent = shown;
    if (chars[i] !== " " && i % 2 === 0) sfx("tick");
    const slow = ".,!?…".includes(chars[i]) ? 6 : 1;
    await wait(1000 / cps * slow * (S.warmth < 20 ? 1.6 : 1));
  }
  d.innerHTML = fmt(text) || "&nbsp;";
  scrollDown();
}

/** Prints lines one after another with a short beat — feels alive. */
async function slowPrint(lines, gap = 70) {
  for (const l of lines) { print(l); await pause(gap); }
}

/* ---------- the prompt ---------- */
function shortPath(p) {
  if (p === "/cottage") return "~";
  if (p.startsWith("/cottage/")) return "~/" + p.slice(9);
  return p;
}
function promptStr() {
  if (T.asking) return T.asking.prompt;
  return (S.name || "you") + "@hearth:" + shortPath(S.cwd) + "$ ";
}
function showLine(on) {
  const l = $("line");
  l.classList.toggle("hide", !on);
  if (on) { $("prompt").textContent = promptStr(); drawMirror(); scrollDown(); }
}

function ghostFor(v) {
  if (!v || v.length < 2 || T.asking) return "";
  for (let i = S.hist.length - 1; i >= 0; i--) {
    const h = S.hist[i];
    if (h.startsWith(v) && h !== v) return h.slice(v.length);
  }
  return "";
}

function drawMirror() {
  const inp = $("cmd"), m = $("mirror");
  let v = inp.value;
  if (T.asking && T.asking.secret) v = "*".repeat(v.length);
  const pos = inp.selectionStart == null ? v.length : inp.selectionStart;
  const before = v.slice(0, pos), at = v[pos] || " ", after = v.slice(pos + 1);
  const ghost = pos === v.length ? ghostFor(inp.value) : "";
  m.innerHTML = esc(before) + '<span class="cur">' + esc(at) + "</span>" + esc(after) +
    (ghost ? '<span class="ghost">' + esc(ghost) + "</span>" : "");
}

function focusInput() {
  const inp = $("cmd");
  if (document.activeElement !== inp) { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }
}

/** Ask the player for a line of text (name, yes/no, passwords, the editor). */
function ask(prompt, secret = false) {
  return new Promise(resolve => {
    T.asking = { resolve, prompt, secret };
    showLine(true);
    focusInput();
  });
}

/** Resolves on the next Enter/tap. Used for fishing and "press enter" moments. */
function awaitKey() { return new Promise(r => { T.keyWait = r; }); }

/* ---------- running commands ---------- */
async function submit(raw) {
  const inp = $("cmd");
  const typing = document.activeElement === inp;
  inp.value = "";
  T.histPos = -1;

  if (T.asking) {
    const a = T.asking; T.asking = null;
    printRaw(esc(a.prompt) + '<span class="hi">' + esc(a.secret ? "*".repeat(raw.length) : raw) + "</span>", "echo");
    showLine(false);
    a.resolve(raw);
    return;
  }
  if (T.busy) return;

  printRaw('<span class="p">' + esc(promptStr()) + '</span><span class="hi">' + esc(raw) + "</span>", "echo");
  const line = raw.trim();
  if (line) {
    if (S.hist[S.hist.length - 1] !== line) S.hist.push(line);
    if (S.hist.length > 300) S.hist.splice(0, S.hist.length - 300);
  }
  T.busy = true; T.skip = false; T.lastCmd = Date.now();
  showLine(false);
  $("led").classList.add("busy");
  try {
    if (line) await shell(line);
  } catch (e) {
    print("{warn:hearth: something went sideways —} {dim:" + esc(e.message) + "}");
    console.error(e);
  }
  $("led").classList.remove("busy");
  T.busy = false; T.skip = false;
  afterCommand();
  if (!T.asking) showLine(true);
  if (typing || T.asking) focusInput();   // don't pop the iPad keyboard up after a tap
}

/** Run a command as if typed (used by tappable {cmd:...} and keycaps). */
function runTyped(c) {
  if (T.keyWait) { const k = T.keyWait; T.keyWait = null; k("tap"); return; }
  if (T.asking) { $("cmd").value = c; drawMirror(); focusInput(); return; }
  if (T.busy) { T.skip = true; return; }
  sfx("key");
  submit(c);
}

/* ---------- tab completion ---------- */
function complete() {
  const inp = $("cmd");
  const v = inp.value;
  const ghost = ghostFor(v);
  const parts = v.split(/\s+/);
  const last = parts[parts.length - 1];
  let cands;
  if (parts.length <= 1) {
    cands = commandNames().filter(n => n.startsWith(last));
  } else {
    const slash = last.lastIndexOf("/");
    const dirPart = slash >= 0 ? last.slice(0, slash + 1) : "";
    const base = slash >= 0 ? last.slice(slash + 1) : last;
    const dir = resolve(dirPart || ".");
    const node = nodeAt(dir);
    cands = [];
    if (node && node.kind === "dir") {
      for (const [n, ch] of Object.entries(children(dir, base.startsWith(".")))) {
        if (n.startsWith(base)) cands.push(dirPart + n + (ch.kind === "dir" ? "/" : ""));
      }
    }
    cands = cands.concat(completeWords(parts[0], parts.length).filter(w => w.startsWith(last)));
    cands = [...new Set(cands)];
  }
  if (!cands.length) { if (ghost) { inp.value = v + ghost; drawMirror(); } else sfx("bonk"); return; }
  if (cands.length === 1) {
    parts[parts.length - 1] = cands[0];
    inp.value = parts.join(" ") + (cands[0].endsWith("/") ? "" : " ");
  } else {
    // common prefix, then show options
    let pre = cands[0];
    for (const c of cands) while (!c.startsWith(pre)) pre = pre.slice(0, -1);
    if (pre.length > last.length) { parts[parts.length - 1] = pre; inp.value = parts.join(" "); }
    else {
      printRaw('<span class="p">' + esc(promptStr()) + "</span>" + esc(v), "echo");
      print("{dim:" + cands.map(esc).join("   ") + "}");
    }
  }
  drawMirror();
}

/* ---------- keyboard ---------- */
function onKey(e) {
  const inp = $("cmd");
  if (T.keyWait && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault(); const k = T.keyWait; T.keyWait = null; k(e.key); return;
  }
  if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
    e.preventDefault();
    if (T.busy) { T.skip = true; print("{dim:^C}"); return; }
    printRaw('<span class="p">' + esc(promptStr()) + "</span>" + esc(inp.value) + '<span class="dim">^C</span>', "echo");
    inp.value = ""; if (T.asking) { const a = T.asking; T.asking = null; a.resolve(null); } drawMirror(); return;
  }
  if (e.ctrlKey && (e.key === "l" || e.key === "L")) { e.preventDefault(); clearScreen(); return; }
  if (T.busy && !T.asking) {
    if (e.key === "Enter" || e.key === "Escape") T.skip = true;
    e.preventDefault(); return;
  }
  if (e.key === "Enter") { e.preventDefault(); sfx("enter"); submit(inp.value); return; }
  if (e.key === "Tab") { e.preventDefault(); complete(); return; }
  if (e.key === "ArrowRight" && inp.selectionStart === inp.value.length) {
    const g = ghostFor(inp.value); if (g) { e.preventDefault(); inp.value += g; drawMirror(); return; }
  }
  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    if (T.asking) return;
    e.preventDefault();
    const h = S.hist;
    if (!h.length) return;
    if (T.histPos === -1) { T.draft = inp.value; T.histPos = h.length; }
    T.histPos += e.key === "ArrowUp" ? -1 : 1;
    if (T.histPos < 0) T.histPos = 0;
    if (T.histPos >= h.length) { T.histPos = -1; inp.value = T.draft; }
    else inp.value = h[T.histPos];
    setTimeout(() => { inp.selectionStart = inp.selectionEnd = inp.value.length; drawMirror(); });
    return;
  }
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) sfx("key");
  if (e.key === "Backspace") sfx("key");
  setTimeout(drawMirror);
}

/* ---------- keycaps under the screen ---------- */
let keysSig = "";
function setKeys(list) {
  const k = $("keys");
  if (!S.keys) { k.classList.add("hide"); return; }
  k.classList.remove("hide");
  const sig = list.join("|");
  if (sig === keysSig) return;
  keysSig = sig;
  k.innerHTML = "";
  for (const c of list) {
    const b = document.createElement("button");
    b.className = "key" + (c.startsWith("⇥") || c.startsWith("↑") ? " fn" : "");
    b.textContent = c;
    b.addEventListener("click", ev => {
      ev.preventDefault();
      if (c === "⇥ tab") { complete(); focusInput(); return; }
      if (c === "↑ again") { if (S.hist.length) runTyped(S.hist[S.hist.length - 1]); return; }
      runTyped(c);
    });
    k.appendChild(b);
  }
}

function termInit() {
  const inp = $("cmd");
  inp.addEventListener("keydown", onKey);
  inp.addEventListener("input", drawMirror);
  inp.addEventListener("select", drawMirror);
  inp.addEventListener("click", drawMirror);
  // tapping the screen focuses the hidden input (and fast-forwards animations)
  $("screen").addEventListener("click", e => {
    const c = e.target.closest && e.target.closest(".cmd");
    if (c) { e.preventDefault(); runTyped(c.dataset.c); return; }
    if (T.keyWait) { const k = T.keyWait; T.keyWait = null; k("tap"); return; }
    if (T.busy && !T.asking) T.skip = true;
    const sel = window.getSelection && String(window.getSelection());
    if (!sel) focusInput();
  });
  // typing anywhere goes to the terminal
  document.addEventListener("keydown", e => {
    if (document.activeElement !== inp && !e.metaKey && (e.key.length === 1 || e.key === "Enter")) {
      focusInput();
      if (T.keyWait && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const k = T.keyWait; T.keyWait = null; k(e.key); }
    }
  });
  // keep the layout above the iPad keyboard
  const vv = window.visualViewport;
  const fit = () => {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty("--vh", h + "px");
    scrollDown();
  };
  if (vv) { vv.addEventListener("resize", fit); vv.addEventListener("scroll", () => window.scrollTo(0, 0)); }
  window.addEventListener("resize", fit);
  fit();
}

/* ---- js/03-audio.js ---- */
/* =====================================================================
   03-audio.js — every sound is made right here with WebAudio.
   No audio files: rain is filtered noise, the kettle is a sine wave
   having a moment, and the radio jazz is a tiny chord machine.
   ===================================================================== */
"use strict";

const A = { ctx: null, master: null, rain: null, rainG: null, wind: null, windG: null, noise: null, radio: null, radioG: null, staticG: null, nextChord: 0, chordI: 0, nextOwl: 0, nextPop: 0 };

function audioWake() {
  if (A.ctx) { if (A.ctx.state === "suspended") A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { A.ctx = new AC(); } catch (e) { return; }
  const c = A.ctx;
  A.master = c.createGain(); A.master.gain.value = S.sound ? 0.8 : 0; A.master.connect(c.destination);

  // two seconds of brown-ish noise, reused for rain, wind, static, splashes
  const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = last * 3.2 + w * 0.08; }
  A.noise = buf;

  const loop = (freq, q, type) => {
    const s = c.createBufferSource(); s.buffer = buf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type || "lowpass"; f.frequency.value = freq; f.Q.value = q || 0.7;
    const g = c.createGain(); g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(A.master); s.start();
    return { s, f, g };
  };
  const r = loop(1400, 0.4); A.rainG = r.g; A.rain = r;
  const w = loop(380, 2.5, "bandpass"); A.windG = w.g; A.wind = w;
  const st = loop(3000, 0.8, "highpass"); A.staticG = st.g;
  A.radioG = c.createGain(); A.radioG.gain.value = 0; A.radioG.connect(A.master);
}

function setSound(on) {
  S.sound = on;
  if (A.master) A.master.gain.setTargetAtTime(on ? 0.8 : 0, A.ctx.currentTime, 0.2);
}

function tone(freq, dur, type = "sine", vol = 0.15, when = 0, glideTo = null) {
  if (!A.ctx || !S.sound) return;
  const c = A.ctx, t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t + dur + 0.05);
}
function burst(dur, freq, vol = 0.2, when = 0, type = "bandpass") {
  if (!A.ctx || !S.sound) return;
  const c = A.ctx, t = c.currentTime + when;
  const s = c.createBufferSource(); s.buffer = A.noise;
  const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 1.2;
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}

function sfx(name) {
  if (!A.ctx || !S.sound) return;
  switch (name) {
    case "key": burst(0.035, rand(1800, 2600), 0.09); tone(rand(140, 180), 0.04, "triangle", 0.04); break;
    case "enter": burst(0.06, 1200, 0.14); tone(110, 0.07, "triangle", 0.06); break;
    case "tick": burst(0.02, rand(2500, 3400), 0.03); break;
    case "bonk": tone(150, 0.12, "square", 0.04, 0, 90); break;
    case "chime": tone(880, 0.9, "sine", 0.09); tone(1318, 1.1, "sine", 0.06, 0.12); tone(1760, 1.4, "sine", 0.035, 0.24); break;
    case "mail": tone(660, 0.4, "triangle", 0.08); tone(990, 0.6, "triangle", 0.06, 0.15); break;
    case "plip": tone(900, 0.18, "sine", 0.1, 0, 500); break;
    case "splash": burst(0.5, 900, 0.25); burst(0.3, 2200, 0.1, 0.05); break;
    case "reel": for (let i = 0; i < 10; i++) burst(0.02, 3000, 0.05, i * 0.04); break;
    case "kettle": tone(1200, 2.4, "sine", 0.05, 0.3, 2100); tone(1800, 2.0, "sine", 0.02, 0.6, 2600); burst(1.5, 5000, 0.05, 0, "highpass"); break;
    case "pour": for (let i = 0; i < 8; i++) burst(0.12, rand(500, 900), 0.06, i * 0.08); break;
    case "purr": for (let i = 0; i < 14; i++) tone(rand(24, 30), 0.09, "sawtooth", 0.05, i * 0.1); break;
    case "page": burst(0.18, 4200, 0.06, 0, "highpass"); break;
    case "door": tone(180, 0.5, "sawtooth", 0.025, 0, 120); burst(0.12, 300, 0.12, 0.45, "lowpass"); break;
    case "dig": burst(0.12, 400, 0.18); burst(0.12, 350, 0.14, 0.18); break;
    case "water": for (let i = 0; i < 12; i++) burst(0.08, rand(2000, 4000), 0.04, i * 0.06); break;
    case "crackle": burst(0.03, rand(1500, 3500), rand(0.04, 0.12)); break;
    case "chop": burst(0.08, 700, 0.3); tone(90, 0.12, "triangle", 0.1); break;
    case "boot": tone(60, 0.6, "sawtooth", 0.05, 0, 40); tone(1000, 0.08, "square", 0.03, 0.7); break;
    case "beep": tone(1000, 0.09, "square", 0.04); break;
    case "fanfare": [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.9, "triangle", 0.07, i * 0.16)); break;
    case "owl": tone(410, 0.35, "sine", 0.05, 0, 380); tone(400, 0.6, "sine", 0.05, 0.5, 360); break;
  }
}

/* ---------- radio jazz: a slow ii–V–I machine with a soft Rhodes-ish voice ---------- */
const CHORDS = [
  [62, 65, 69, 72], [55, 59, 62, 65], [60, 64, 67, 71], [57, 60, 64, 67],
  [62, 65, 69, 72], [55, 59, 62, 65], [64, 67, 71, 74], [57, 61, 64, 67]
];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function rhodes(m, t, dur, vol) {
  const c = A.ctx;
  for (const [mul, v] of [[1, 1], [2, 0.18], [3, 0.05]]) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = mtof(m) * mul;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(A.radioG); o.start(t); o.stop(t + dur + 0.1);
  }
}
function radioTick() {
  if (!A.ctx || S.flags.radioOn !== "88.8") return;
  const c = A.ctx;
  if (c.currentTime < A.nextChord - 0.2) return;
  const t = Math.max(c.currentTime + 0.05, A.nextChord);
  const ch = CHORDS[A.chordI++ % CHORDS.length];
  ch.forEach((m, i) => rhodes(m, t + i * 0.03, 3.4, 0.05));
  rhodes(ch[0] - 24, t, 2.6, 0.08);
  // a lazy little melody note now and then
  if (chance(0.7)) rhodes(ch[randi(1, 3)] + 12, t + rand(0.6, 1.6), 1.6, 0.04);
  if (chance(0.4)) rhodes(ch[randi(0, 3)] + 12, t + rand(1.8, 2.6), 1.4, 0.035);
  A.nextChord = t + 3.2;
}

/* ---------- ambience, called about once a second ---------- */
function ambience() {
  if (!A.ctx) return;
  const c = A.ctx, t = c.currentTime;
  const w = weatherNow();
  const outside = ["garden", "dock", "roof"].includes(roomName());
  const rainy = w.rain * (outside ? 1 : 0.45);
  A.rainG.gain.setTargetAtTime(rainy * 0.35, t, 1.5);
  A.rain.f.frequency.setTargetAtTime(outside ? 2200 : 900, t, 1);
  A.windG.gain.setTargetAtTime(w.wind * (outside ? 0.25 : 0.08), t, 2);
  A.wind.f.frequency.setTargetAtTime(300 + Math.sin(t * 0.3) * 120, t, 1);
  const on = S.flags.radioOn;
  A.radioG.gain.setTargetAtTime(on === "88.8" ? 0.9 : 0, t, 0.4);
  A.staticG.gain.setTargetAtTime(on && on !== "88.8" && on !== "101.3" && on !== "93.1" && on !== "104.5" ? 0.04 : 0, t, 0.3);
  radioTick();
  // the stove crackles if it's lit and you're near it
  if (fireLit() && roomName() === "parlour" && t > A.nextPop) { for (let i = 0; i < randi(1, 4); i++) sfx("crackle"); A.nextPop = t + rand(0.2, 1.4); }
  // owls, but only at night and only sometimes
  if (isNight() && t > A.nextOwl) { if (chance(0.25)) sfx("owl"); A.nextOwl = t + rand(25, 70); }
}

/* ---- js/04-world.js ---- */
/* =====================================================================
   04-world.js — time, weather, warmth, the stove, and the cat's
   daily wanderings. The clock moves one minute per real second while
   you're here, and a few minutes for everything you do.
   ===================================================================== */
"use strict";

const SEASON = d => (d <= SEASON_END ? "autumn" : "winter");
const DAYNAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const dayName = d => DAYNAMES[(d + 2) % 7];    // day 1 is a Wednesday. it just is.
const dateStr = d => (d <= 30 ? "October " + (d + 11) : "November " + (d - 19));   // day 1 = Oct 12, day 14 = Oct 25

/* ---------- weather ----------
   Deterministic per day so the radio forecast is never a liar.
   Some days are hand-picked because the story wants them that way.  */
const WEATHER = {
  clear:   { name: "clear",          rain: 0,   wind: 0.1, cloud: 0,    fog: 0,   snow: 0, word: "clear and crisp" },
  cloudy:  { name: "cloudy",         rain: 0,   wind: 0.3, cloud: 0.7,  fog: 0,   snow: 0, word: "grey and soft" },
  drizzle: { name: "drizzle",        rain: 0.5, wind: 0.2, cloud: 0.8,  fog: 0.1, snow: 0, word: "drizzly" },
  rain:    { name: "rain",           rain: 1,   wind: 0.4, cloud: 1,    fog: 0.1, snow: 0, word: "properly rainy" },
  fog:     { name: "fog",            rain: 0,   wind: 0,   cloud: 0.5,  fog: 0.9, snow: 0, word: "foggy, like the lake's thinking" },
  windy:   { name: "windy",          rain: 0,   wind: 1,   cloud: 0.4,  fog: 0,   snow: 0, word: "blustery" },
  snow:    { name: "snow",           rain: 0,   wind: 0.2, cloud: 0.9,  fog: 0.2, snow: 1, word: "snowing, quietly" }
};
const FIXED_WEATHER = { 1: "drizzle", 2: "cloudy", 3: "clear", 5: "rain", 8: "fog", 10: "clear", 11: "clear", 13: "windy", 14: "clear", 15: "snow" };
function weatherFor(day) {
  if (FIXED_WEATHER[day]) return WEATHER[FIXED_WEATHER[day]];
  const r = seeded(day * 7919 + 13)();
  if (day > SEASON_END) return WEATHER[r < 0.45 ? "snow" : r < 0.7 ? "cloudy" : r < 0.85 ? "clear" : "fog"];
  return WEATHER[r < 0.28 ? "clear" : r < 0.48 ? "cloudy" : r < 0.62 ? "drizzle" : r < 0.76 ? "rain" : r < 0.88 ? "fog" : "windy"];
}
function weatherNow() {
  const w = weatherFor(S.day);
  // rain eases off in the small hours; fog burns off by noon
  if (w.fog && S.min > 12 * 60) return Object.assign({}, w, { fog: w.fog * 0.3 });
  return w;
}

const isNight = () => S.min >= 20 * 60 || S.min < 6 * 60;
const isEvening = () => S.min >= 17 * 60 && S.min < 20 * 60;
const isMorning = () => S.min >= 6 * 60 && S.min < 11 * 60;
const fireLit = () => S.fireUntil > now();
const teaWarm = () => now() - S.teaAt < 45;
const roomName = () => (S.cwd.startsWith("/cottage/") ? S.cwd.split("/")[2] : S.cwd === "/cottage" ? "hall" : "elsewhere");

function partOfDay() {
  const m = S.min;
  if (m < 6 * 60) return "the small hours";
  if (m < 9 * 60) return "early morning";
  if (m < 12 * 60) return "morning";
  if (m < 14 * 60) return "midday";
  if (m < 17 * 60) return "afternoon";
  if (m < 20 * 60) return "evening";
  if (m < 23 * 60) return "night";
  return "late, late night";
}

/* ---------- time passing ---------- */
let lastTick = Date.now(), tickAcc = 0;

/** Spend some minutes doing a thing. Returns false if it's too late to bother. */
function spend(mins) {
  S.min += mins;
  S.warmth = clamp(S.warmth - mins * (fireLit() ? 0.005 : 0.03), 0, 100);
  // (falling asleep at 1:30am is handled in worldTick, between commands)
}

function warm(n, why) {
  const before = S.warmth;
  S.warmth = clamp(S.warmth + n, 0, 100);
  if (why && S.warmth > before + 1) print("{dim:(" + why + ")}");
}

/** Called every second from the main loop. */
function worldTick() {
  const t = Date.now();
  let dt = (t - lastTick) / 1000; lastTick = t;
  if (dt > 5 || document.hidden || !S.name || T.ending) return;   // paused while you're away
  tickAcc += dt;
  while (tickAcc >= 1) {
    tickAcc -= 1;
    S.min += 1;
    S.warmth = clamp(S.warmth - (fireLit() ? 0 : 0.02) + (fireLit() && roomName() === "parlour" ? 0.04 : 0), 0, 100);
    if (S.min === 22 * 60 && !T.busy) { print(""); print("{dim:(it's ten o'clock. somewhere a clock agrees. {cmd:sleep} whenever you're ready.)}"); showLine(!T.busy); }
    if (S.min === 25 * 60 && !T.busy) { print(""); print("{dim:(it's 1am. your eyes are doing that thing.)}"); showLine(!T.busy); keepsake("night_owl"); }
    if (S.min >= 25 * 60 + 30 && !T.busy && !T.asking) { T.busy = true; nodOff().then(() => { T.busy = false; showLine(true); }); }
    catWander();
    maybeCatKeyboard();
    idleMoment();
  }
}

/* ---------- small things that happen while you sit still ---------- */
let lastIdle = Date.now();
function idleMoment() {
  if (T.busy || T.asking || !S.name) return;
  const quiet = Date.now() - Math.max(lastIdle, T.lastCmd || 0);
  if (quiet < 150000 || !chance(1 / 40)) return;
  lastIdle = Date.now();
  const r = roomName(), w = weatherNow(), m = S.min;
  const pool = [
    "a floorboard upstairs.",
    "the mantel clock chimes " + (Math.floor(m / 60) % 12 || 12) + ", a bit late.",
    "under the floor, the hum dips, and comes back.",
    "the hum. you'd stopped hearing it. now you can't stop."
  ];
  if (w.rain) pool.push("the rain gets heavier for a minute, then eases.", "a drip in the gutter, the same note over and over.");
  if (w.wind > 0.6) pool.push("wind in the chimney.");
  if (w.fog > 0.5) pool.push("a foghorn, a long way off.");
  if (isNight()) pool.push("an owl. another, further off.", "headlights on the far road, sweeping across the lake.");
  else pool.push("a blackbird on the sill. it looks in, and goes.", "someone across the lake chopping wood. the sound comes a second late.");
  if (teaWarm()) pool.push("the teapot ticks as it cools.");
  if (fireLit()) pool.push("a log settles in the stove.");
  if (r === "kitchen") pool.push("the fridge shudders and goes quiet.");
  if (r === "study") pool.push("HEARTH's fan spins up and down again.", "the radio on the shelf crackles once, by itself.");
  if (r === "dock") pool.push("a fish jumps, far out.", "the cable at your feet ticks.");
  if (r === "cellar") pool.push("the box's green light blinks three times, and then once.");
  if (S.cat.room === r) pool.push("Biscuit, asleep, twitches.", "Biscuit yawns.");
  print("{dim:(" + pick(pool) + ")}");
  showLine(true);
}

async function nodOff() {
  if (T.ending) return;
  T.ending = true;
  print("");
  await type("your head tips forward. the keyboard is surprisingly comfortable.", 40, "dim");
  await pause(500);
  print("{dim:zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz}");
  await pause(800);
  T.ending = false;
  await newDay(true);
}

/* ---------- the cat ----------
   Biscuit has a schedule. It is not a schedule you get a copy of.  */
const CAT_SPOTS = {
  morning: ["kitchen", "kitchen", "garden", "study"],
  day: ["garden", "study", "parlour", "attic", "greenhouse", "dock"],
  evening: ["parlour", "parlour", "kitchen", "study"],
  night: ["parlour", "study", "attic", "hall"]
};
function catWander() {
  if (!chance(1 / 50)) return;
  const pool = isMorning() ? CAT_SPOTS.morning : isEvening() ? CAT_SPOTS.evening : isNight() ? CAT_SPOTS.night : CAT_SPOTS.day;
  let next = pick(pool);
  if (next === "greenhouse" && !S.flags.ghOpen) next = "garden";
  if (next === "attic" && !S.flags.atticLit) next = "study";

/* ---- js/05-fs.js ---- */
/* =====================================================================
   05-fs.js — the cottage is a filesystem. Rooms are directories, notes
   are files, the cat is a process. Wren wired it up that way in 1987
   and nobody has had the heart to change it.

   A node looks like:
     { kind: "dir",  desc, kids: {...} | () => ({...}), lock?, dark?, when?, room? }
     { kind: "file", text: "..." | () => "...", item?, when?, onRead?, owner?, exec? }
   ===================================================================== */
"use strict";

const D = (desc, kids = {}, o = {}) => Object.assign({ kind: "dir", desc, kids }, o);
const F = (text, o = {}) => Object.assign({ kind: "file", text }, o);
const HOME = "/cottage";
let ROOT = D("", {});            // filled in by 06-content.js

function resolve(p) {
  if (p == null || p === "") return S.cwd;
  if (p === "-") return S.prevCwd || S.cwd;
  if (p === "~") p = HOME;
  else if (p.startsWith("~/")) p = HOME + p.slice(1);
  const abs = p.startsWith("/") ? p : S.cwd + "/" + p;
  const out = [];
  for (const part of abs.split("/")) {
    if (!part || part === ".") continue;
    if (part === "..") out.pop(); else out.push(part);
  }
  return "/" + out.join("/");
}

const val = (x, ...a) => (typeof x === "function" ? x(...a) : x);
const visible = (path, node) => node && !S.taken[path] && (!node.when || node.when());

/** All the children of a directory (including files the player wrote). */
function children(path, all = false) {
  const node = nodeAt(path);
  if (!node || node.kind !== "dir") return {};
  const base = path === "/" ? "" : path;
  const kids = Object.assign({}, val(node.kids) || {});
  for (const fp of Object.keys(S.files)) {
    const i = fp.lastIndexOf("/");
    if ((fp.slice(0, i) || "/") === path) kids[fp.slice(i + 1)] = F(() => S.files[fp], { owner: "you", user: true, exec: fp.endsWith(".sh") });
  }
  const out = {};
  for (const [n, ch] of Object.entries(kids)) {
    if (!all && n.startsWith(".")) continue;
    if (!visible(base + "/" + n, ch)) continue;
    out[n] = ch;
  }
  return out;
}

function nodeAt(path) {
  if (path === "/") return ROOT;
  const parts = path.split("/").filter(Boolean);
  let node = ROOT, cur = "";
  for (const part of parts) {
    if (!node || node.kind !== "dir") return null;
    const kids = val(node.kids) || {};
    let next = kids[part];
    const fp = cur + "/" + part;
    if (!next && S.files[fp] != null) next = F(() => S.files[fp], { owner: "you", user: true, exec: fp.endsWith(".sh") });
    if (!visible(fp, next)) return null;
    node = next; cur = fp;
  }
  return node;
}

const isDir = p => { const n = nodeAt(p); return n && n.kind === "dir"; };
const lockMsg = p => { const n = nodeAt(p); return n && n.lock ? n.lock() : null; };
const isDark = p => { const n = nodeAt(p); return !!(n && n.dark && n.dark()); };

/** Find something by name in the current room (for take/use/look). Forgiving about extensions. */
function findHere(name, where = S.cwd) {
  if (!name) return null;
  name = name.replace(/\/$/, "");
  const kids = children(where, true);
  if (kids[name]) return { name, path: (where === "/" ? "" : where) + "/" + name, node: kids[name] };
  const lower = name.toLowerCase();
  for (const [n, node] of Object.entries(kids)) {
    const stem = n.toLowerCase().replace(/^\./, "").replace(/\.(txt|dsk|card|book|log|sh|note)$/, "").replace(/_/g, " ");
    if (stem === lower || stem === lower.replace(/_/g, " ") || stem.split(" ").includes(lower)) {
      return { name: n, path: (where === "/" ? "" : where) + "/" + n, node };
    }
  }
  return null;
}

/** Read a file's text, marking it read and running any onRead side effects. */
function readFile(path) {
  const node = nodeAt(path);
  if (!node || node.kind !== "file") return null;
  const text = val(node.text);
  const first = !S.read[path];
  S.read[path] = true;
  if (node.onRead) node.onRead(first);
  return text;
}

function perm(node) {
  if (node.kind === "dir") return node.lock && node.lock() ? "d---------" : "drwxr-xr-x";
  if (node.exec) return "-rwxr-xr-x";
  return node.user ? "-rw-r--r--" : "-rw-r--r--";
}
function sizeOf(node) {
  if (node.kind === "dir") return 4096;
  const t = val(node.text);
  return t ? plain(t).length : 0;
}

/** Make a path the player is allowed to write to. */
function writable(path) {
  const dir = path.slice(0, path.lastIndexOf("/")) || "/";
  if (!dir.startsWith(HOME)) return "only inside the cottage. (" + dir + " belongs to the machine.)";
  if (!isDir(dir)) return "there's no " + dir + ".";
  const existing = nodeAt(path);
  if (existing && !existing.user) return "that's one of Wren's. you'd never write over one of Wren's.";
  if (isDark(dir)) return "you can't write in the dark.";
  return null;
}

function letterText(id) {
  const L = LETTERS[id] || (S.dyn && S.dyn[id]);
  if (!L) return "{dim:(a letter that seems to have gone missing)}";
  return typeof L.text === "function" ? L.text() : L.text;
}
function letterMeta(id) { return LETTERS[id] || (S.dyn && S.dyn[id]); }

/** Every morning: scheduled letters, replies to what you sent, and the outbox. */
function deliverMail() {
  S.dyn = S.dyn || {};
  let n = 0;
  for (const [id, L] of Object.entries(LETTERS)) {
    if (L.day === S.day && !S.letters.includes(id) && (!L.when || L.when())) { S.mailbox.push(id); S.letters.push(id); n++; }
  }
  for (const o of S.outbox) {
    const id = "r" + S.day + "_" + o.to + "_" + Math.random().toString(36).slice(2, 6);
    S.dyn[id] = reply(o.to, o.item);
    S.mailbox.push(id); S.letters.push(id); n++;
  }
  S.outbox = [];
  return n;
}

function openLetter(id) {
  const L = letterMeta(id);
  if (!L) return;
  const p = PEOPLE[L.from];
  print("{dim:from:} " + (p ? "{" + p.color + ":" + p.full + "}" : "{acc:Wren}") + "   {dim:re: " + esc(L.subject) + "}");
  print("{dim:" + "-".repeat(46) + "}");
  print(letterText(id));
  const i = S.mailbox.indexOf(id);
  if (i >= 0) {
    S.mailbox.splice(i, 1);
    if (L.onOpen) L.onOpen();
    if (L.reward) {
      blank();
      for (const [k, n] of Object.entries(L.reward)) { give(k, n); print("{ok:(enclosed: " + itemName(k, n) + ")}"); }
    }
    if (L.friend && PEOPLE[L.from]) befriend(L.from, L.friend);
  }
  sfx("page");
}

/* ---------- friendship ---------- */
function befriend(who, n) {
  const before = S.friends[who];
  S.friends[who] = clamp(before + n, 0, 10);
  if (before < 8 && S.friends[who] >= 8) { keepsake("friend"); toast(PEOPLE[who].short + " thinks of you as <b>a dear friend</b>"); }
  if (Object.values(S.friends).every(v => v >= 8)) keepsake("allfriends");
}
function hearts(n) { const h = Math.floor(n / 2); return "{warn:" + "♥".repeat(h) + "}{dim:" + "♡".repeat(5 - h) + "}"; }

/* ---------- what happens when you send someone something ---------- */
function reply(to, item) {
  const p = PEOPLE[to];
  const L = { from: to, subject: "re: your parcel", reward: null, friend: 1, text: "" };
  const say = s => (L.text = s + "\n\n{dim:" + p.sign + "}");

  // --- quests first ---
  if (to === "fenn" && item === "lavender" && S.quests.fenn_lav === "open") {
    S.quests.fenn_lav = "done"; S.flags.gotCakeCard = true; L.reward = { honey: 3 }; L.friend = 3; L.subject = "Bees.";
    say(`${NAME()}.\n\nPut it by the hives. They went quiet, then loud. That's good.\n\nThree jars of honey. And the honey cake card. Wren took it off\nmy mother in 1979. Have it.`);
    remember("Fenn's bees got their lavender.");
    return L;
  }
  if (to === "fenn" && item === "fish:trout" && S.quests.fenn_trout === "open") {
    S.quests.fenn_trout = "done"; L.reward = { candle: 2 }; L.friend = 3; L.subject = "Trout.";
    say(`${NAME()}.\n\nFried it. Ate it at the window. Good fish.\n\nTwo candles. Beeswax. For the cold.`);
    remember("sent Fenn a trout. he sent candles.");
    return L;
  }
  if (to === "ottoline" && item === "pumpkin" && S.quests.otto_pump === "open") {
    S.quests.otto_pump = "done"; L.reward = { "seed:carrot": 3, jam: 1 }; L.friend = 3; L.subject = "the pumpkin";
    say(`${NAME()},\n\nIt's on the counter and everyone who comes in for stamps says "oh".\nI'm going to carve it into Biscuit.\n\nCarrot seeds, and a jar of quince jelly. Wren says it's "fine".\nFrom her that's a medal.`);
    remember("Ottoline's going to carve my pumpkin into Biscuit.");
    return L;
  }
  if (to === "ottoline" && ["pumpkin_pie", "honey_cake", "mint_biscuits"].includes(item) && S.quests.otto_bake === "open") {
    S.quests.otto_bake = "done"; L.reward = { "seed:mint": 2 }; L.friend = 3; L.subject = "we won";
    say(`${NAME()},\n\nGone in eleven minutes. Fenn's took fourteen. He said "well done"\nlike he was closing a gate. Best day I've had in years.\n\nMint seeds, from the windowbox.`);
    remember("beat Fenn at the bake sale. by proxy.");
    return L;
  }
  if (to === "juniper" && item === "carrot_soup" && S.quests.jun_soup === "open") {
    S.quests.jun_soup = "done"; L.reward = { "disk:sky": 1, "seed:moonflower": 2 }; L.friend = 3; L.subject = "soup";
    say(`${NAME()},\n\nStill warm when it got here, so Ottoline ran. I ate it at the\neyepiece with my coat on.\n\nEnclosed, as promised. The telescope disk, which is mine, and\ntwo moonflower seeds, which are Wren's. She gave them to me in\n1988 and said "give them to whoever's next." I didn't think\nthere'd be a next.\n\nGreenhouse. At night.`);
    remember("Juniper sent the telescope disk and two moonflower seeds. 'whoever's next.'");
    return L;
  }
  if (to === "juniper" && S.quests.jun_comet === "open" && S.flags.sawComet) {
    S.quests.jun_comet = "done"; L.reward = { starchart: 1 }; L.friend = 3; L.subject = "you saw it";
    S.flags.nameKnown = true; clue("name");
    say(`${NAME()},\n\nYou saw it.\n\nWe made a promise not to say its name. I've kept it sixty-four\nyears. But she's not here and you are, and I'm seventy-nine.\n\nWe called it {acc:the Lantern Fish}. Because of what came up out\nof the water to meet it.\n\nMy chart from 1962 is enclosed. Look after it.`);
    remember("Juniper told me the comet's name. I'm not telling anyone.");
    return L;
  }
  if (to === "pip" && item.startsWith("file:") && S.quests.pip_lesson === "open") {
    S.quests.pip_lesson = "done"; L.reward = { "disk:pip": 1 }; L.friend = 3; L.subject = "I LEARNED IT";
    const body = (S.files[item.slice(5)] || "").trim();

    pip: fav ? [`${nice.toUpperCase()}!!!`, `you sent me ${nice}. Mum says I have to say thank you properly so: THANK YOU PROPERLY.`] : [`thank you for the ${nice}. I've named it Gary.`, `a ${nice}! I'm going to do science on it.`],
    juniper: fav ? [`${cap(nice)}. Exactly right. Thank you.`, `I had the ${nice} at the eyepiece. Saturn was very good last night.`] : [`Thank you for the ${nice}. It's on the sill by the charts.`, `${cap(nice)}. It's quiet up here. Your parcels help.`]
  };
  if (item.startsWith("junk:")) {
    const jl = { ottoline: "A boot. Is this a Wren joke? It's in the window anyway.", fenn: "Boot. Wrong size. Planting thyme in it.", pip: "WEIRD STUFF. more please", juniper: "A boot. I've decided not to ask." };
    L.friend = to === "pip" ? 2 : 0;
    say(`${NAME()},\n\n${jl[to]}`);
    return L;
  }
  if (item.startsWith("file:")) {
    const fl = { ottoline: "Got your note. Lovely to hear from the cottage.", fenn: "Read your note. Good note.", pip: "I'm going to frame your file. can you frame a file", juniper: "I read your note twice. Keep writing things down. It's how anyone ever finds anything out." };
    say(`${NAME()},\n\n${fl[to]}`);
    return L;
  }
  say(`${NAME()},\n\n${pick(lines[to])}`);
  return L;
}

/* =====================================================================
   08-garden.js — six raised beds and three pots in the greenhouse.
   Plants grow overnight if they had water that day. Rain counts.
   Nothing ever dies. (Wren's garden, Wren's rules.)
   ===================================================================== */
"use strict";

const CROPS = {
  mint:       { days: 2, yield: 2, regrow: true,  art: ["%%%%%", "%%|%%"], col: "ok",   note: "comes back after you pick it" },
  carrot:     { days: 3, yield: 2,                art: [" \\|/ ", "  V  "], col: "acc",  note: "sulky but worth it" },
  chamomile:  { days: 3, yield: 2,                art: ["o o o", " \\|/ "], col: "hi",   note: "little daisies that smell like hay" },
  lavender:   { days: 4, yield: 3,                art: ["i i i", " |||" + " "], col: "sky", note: "bees go mad for it" },
  pumpkin:    { days: 5, yield: 1,                art: [" _|_ ", "(___)"], col: "acc",  note: "for lanterns, and pie" },
  moonflower: { days: 3, yield: 1, gh: true,      art: [" (*) ", "  |  "], col: "hi",   note: "greenhouse only. blooms at night." }
};

function stageOf(p) {
  if (!p.crop) return -1;
  const c = CROPS[p.crop];
  if (p.age >= c.days) return 3;
  if (p.age === 0) return 0;
  return p.age >= c.days - 1 ? 2 : 1;
}
const ready = p => p.crop && p.age >= CROPS[p.crop].days;

function plotArt(p, gh) {
  const s = stageOf(p);
  const soil = gh ? "[___]" : "~~~~~";
  if (s === -1) return ["     ", "     ", "{dim:" + soil + "}"];
  if (s === 0) return ["     ", "{dim:  .  }", "{dim:" + soil + "}"];
  if (s === 1) return ["     ", "{ok:  ,  }", "{dim:" + soil + "}"];
  if (s === 2) return ["{ok:  ,  }", "{ok: \\|/ }", "{dim:" + soil + "}"];
  const c = CROPS[p.crop];
  let art = c.art;
  if (p.crop === "moonflower" && !isNight()) art = ["  ^  ", "  |  "];
  return ["{" + c.col + ":" + esc(art[0]) + "}", "{ok:" + esc(art[1]) + "}", "{dim:" + soil + "}"];
}

function plotText(p, n, gh) {
  const where = gh ? "pot" : "plot";
  if (!p.crop) return "{dim:" + where + " " + n + ": empty soil, dark and crumbly. ready for something.}\n{cmd:plant mint}";
  const c = CROPS[p.crop];
  const left = Math.max(0, c.days - p.age);
  const art = plotArt(p, gh).join("\n");
  return art + "\n\n" + where + " " + n + ": {hi:" + p.crop + "} — " + (ready(p) ? (p.crop === "moonflower" && !isNight() ? "{acc:a closed bud. it'll open after dark.}" : "{ok:ready to harvest!} {cmd:harvest}") : "about " + plural(left, "more night") + " to go.") +
    (gh ? "" : "\n" + (p.wet || weatherNow().rain ? "{sky:the soil's damp.}" : "{warn:looks thirsty.} {cmd:water}"));
}

/** The pretty overview. */
function gardenView(gh) {
  const beds = gh ? S.gh : S.plots;
  const arts = beds.map(p => plotArt(p, gh));
  const lines = [];
  for (let r = 0; r < 3; r++) lines.push("  " + arts.map(a => a[r]).join("   "));
  lines.push("  " + beds.map((p, i) => "{dim:" + pad((gh ? "pot" : "plot") + (i + 1), 5) + "}").join("   "));
  lines.push("");
  beds.forEach((p, i) => {
    if (!p.crop) return;
    const c = CROPS[p.crop];
    const st = ready(p) ? (p.crop === "moonflower" && !isNight() ? "{acc:bud (opens at night)}" : "{ok:ready!}") : "{dim:" + plural(c.days - p.age, "night") + " to go}";
    const wet = gh ? "" : p.wet || weatherNow().rain ? " {sky:~ watered}" : " {warn:~ thirsty}";
    lines.push("  " + (gh ? "pot " : "plot ") + (i + 1) + ": {hi:" + pad(p.crop, 10) + "} " + st + wet);
  });
  if (beds.every(p => !p.crop)) lines.push("  {dim:all empty. seeds in your pockets: }" + seedList());
  return lines;
}
function seedList() {
  const s = Object.keys(S.inv).filter(k => k.startsWith("seed:")).map(k => "{cmd:plant " + k.slice(5) + "} {dim:x" + S.inv[k] + "}");
  return s.length ? s.join("  ") : "{dim:none. people send seeds; and the shed hides some.}";
}

function inGarden() { return roomName() === "garden"; }
function inGh() { return roomName() === "greenhouse"; }

function doPlant(args) {
  if (!inGarden() && !inGh()) return print("You need to be in the {cmd:cd ~/garden} (or the greenhouse) to plant things. Seeds don't take to carpet.");
  const seeds = Object.keys(S.inv).filter(k => k.startsWith("seed:")).map(k => k.slice(5));
  let crop = (args[0] || "").toLowerCase().replace(/s$/, "").replace(/^seed:/, "");
  if (crop === "carrots") crop = "carrot";
  if (!crop) {
    if (!seeds.length) return print("You haven't got any seeds. {dim:(check the shed. check it thoroughly.)}");
    if (seeds.length === 1) crop = seeds[0];
    else return print("Plant what? You've got: " + seedList());
  }
  if (!CROPS[crop]) { const g = closest(crop, Object.keys(CROPS)); return print("There's no such thing as " + esc(crop) + " seeds." + (g ? " {dim:(did you mean {cmd:plant " + g + "}?)}" : "")); }
  if (!has("seed:" + crop)) return print("You're out of " + crop + " seeds." + (seeds.length ? " You have: " + seedList() : ""));
  const gh = inGh();
  if (CROPS[crop].gh && !gh) return print("Moonflowers only grow in the greenhouse. They need the warm and the dark. {dim:(Wren's note in there says so too.)}");
  const beds = gh ? S.gh : S.plots;
  let i = args[1] ? parseInt(String(args[1]).replace(/\D/g, ""), 10) - 1 : beds.findIndex(p => !p.crop);
  if (isNaN(i) || i < 0 || i >= beds.length) i = beds.findIndex(p => !p.crop);
  if (i < 0) return print("Every " + (gh ? "pot" : "bed") + " is full. {dim:(harvest something first.)}");
  if (beds[i].crop) return print((gh ? "Pot " : "Plot ") + (i + 1) + " already has " + beds[i].crop + " in it.");
  take("seed:" + crop);
  beds[i] = { crop, age: 0, wet: gh || weatherNow().rain > 0 };
  spend(6); sfx("dig");
  print(pick([
    "A hole with your finger, the " + crop + " seed in, soil back over.",
    "You plant the " + crop + " in " + (gh ? "pot " : "plot ") + (i + 1) + ".",
    "In goes the " + crop + ". A worm comes up to look and goes back down."
  ]));
  if (!gh && !beds[i].wet) print("{dim:(it'll want some {cmd:water} before tonight.)}");
  if (!S.flags.planted) { S.flags.planted = true; keepsake("first_plant"); }
  remember("planted " + crop + ".");
}

function doWater() {
  if (inGh()) return print("The mister hisses at you. It's got this. {dim:(the greenhouse waters itself.)}");
  if (!inGarden()) return print("Nothing to water in here, unless you count Biscuit, and you shouldn't.");
  const thirsty = S.plots.filter(p => p.crop && !p.wet);
  if (weatherNow().rain) { S.plots.forEach(p => (p.wet = true)); return print("It's raining. The beds are fine."); }
  if (!S.plots.some(p => p.crop)) return print("You water the empty beds. The soil appreciates the thought.");
  if (!thirsty.length) return print("Everything's watered.");
  S.plots.forEach(p => { if (p.crop) p.wet = true; });
  spend(8); sfx("water");
  print("You fill the can at the water butt and go along the beds." + pick(["", " A blackbird follows you.", " You water a snail by accident."]));
  remember("watered the garden.");
}

function doHarvest() {
  const gh = inGh();
  if (!inGarden() && !gh) return print("Nothing to harvest here. {dim:(the garden's that way: {cmd:cd ~/garden})}");
  const beds = gh ? S.gh : S.plots;
  const got = [];
  let closedBud = false;
  beds.forEach((p, i) => {
    if (!ready(p)) return;
    if (p.crop === "moonflower" && !isNight()) { closedBud = true; return; }
    const c = CROPS[p.crop];
    give(p.crop, c.yield); got.push(itemName(p.crop, c.yield));
    if (p.crop === "moonflower" && chance(0.6)) { give("seed:moonflower"); got.push("a moonflower seed"); }
    S.stats.harvests++;
    if (c.regrow) beds[i] = { crop: p.crop, age: 0, wet: p.wet };
    else beds[i] = { crop: null, age: 0, wet: false };
  });
  if (!got.length) return print(closedBud ? "The moonflower's still a tight little bud. It only opens after dark. {dim:(come back tonight.)}" : "Nothing's ready yet. {dim:(things grow overnight — {cmd:garden} shows how long.)}");
  spend(10); sfx("dig");
  print("You harvest: {ok:" + got.join(", ") + "}.");
  if (got.some(g => g.includes("moonflower"))) print("{dim:The moonflower glows faintly in your hand, a pale blue-gold, like it's remembering the moon.}");
  keepsake("first_harv");
  remember("harvested " + got.join(", ") + ".");
}

/** Overnight growth. Returns a little summary for the morning. */
function growGarden() {
  const yesterday = weatherFor(S.day - 1);
  const winterSlow = S.day - 1 > SEASON_END && (S.day % 2 === 0);
  const notes = [];
  S.plots.forEach(p => {
    if (!p.crop) return;
    const was = ready(p);
    if ((p.wet || yesterday.rain) && !winterSlow) p.age++;
    else if (!p.wet && !yesterday.rain) notes.push("dry");
    p.wet = false;
    if (!was && ready(p)) notes.push(p.crop);
  });
  S.gh.forEach(p => { if (!p.crop) return; const was = ready(p); p.age++; if (!was && ready(p)) notes.push(p.crop); });
  S.flags.overnight = notes;
}

"use strict";

const ITEMS = {

  lavender: ["lavender", "sprigs of lavender"], pumpkin: ["pumpkin", "pumpkins"], moonflower: ["moonflower", "moonflowers"],
  honey: ["jar of honey", "jars of honey"], jam: ["jar of jam", "jars of jam"], candle: ["beeswax candle", "beeswax candles"],
  matches: ["box of matches", "boxes of matches"], lamp: ["oil lamp", "oil lamps"], oilcan: ["oilcan", "oilcans"],
  rod: ["fishing rod", "fishing rods"], umbrella: ["duck umbrella", "duck umbrellas"], wick: ["lantern wick", "lantern wicks"],
  key: ["little brass key", "little brass keys"], starchart: ["star chart (1962)", "star charts"], bracelet: ["orange friendship bracelet", "friendship bracelets"],
  sandwich: ["sandwich", "sandwiches"],
  carrot_soup: ["flask of carrot soup", "flasks of carrot soup"], fish_pie: ["fish pie", "fish pies"], jam_toast: ["jam on toast", "rounds of jam on toast"],
  pumpkin_pie: ["pumpkin pie", "pumpkin pies"], honey_cake: ["honey cake", "honey cakes"], mint_biscuits: ["tin of mint biscuits", "tins of mint biscuits"],
  "junk:boot": ["old boot", "old boots"], "junk:bottle": ["message in a bottle", "messages in bottles"], "junk:can": ["rusty tin can", "rusty tin cans"]
};
function itemName(k, n = 1) {
  if (k.startsWith("seed:")) return (n === 1 ? "a " : n + " ") + k.slice(5) + " seed" + (n === 1 ? "" : "s");
  if (k.startsWith("disk:")) return k.slice(5) + ".dsk";
  if (k.startsWith("fish:")) return (n === 1 ? "a " : n + " ") + k.slice(5);
  if (k.startsWith("file:")) return "your note '" + k.slice(k.lastIndexOf("/") + 1) + "'";
  const e = ITEMS[k];
  if (!e) return (n === 1 ? "" : n + " ") + k.replace(/_/g, " ");
  return n === 1 ? (/^[aeiou]/.test(e[0]) ? "an " : "a ") + e[0] : n + " " + e[1];
}
/** Turn whatever the player typed into an inventory key ("trout" -> "fish:trout"). */
function itemKey(word) {
  if (!word) return null;
  let w = word.toLowerCase().replace(/^(a|an|the|some)\s+/, "").trim().replace(/\s+/g, "_");
  const tries = [w, w.replace(/s$/, ""), w.replace(/es$/, ""), "fish:" + w, "fish:" + w.replace(/s$/, ""), "junk:" + w, "junk:" + w.replace(/s$/, ""), "seed:" + w.replace(/_?seeds?$/, ""), "disk:" + w.replace(/\.dsk$/, "")];
  for (const t of tries) if (S.inv[t]) return t;
  for (const k of Object.keys(S.inv)) if (itemName(k).toLowerCase().includes(w.replace(/_/g, " "))) return k;
  return null;
}

function recipeCard(id) { return "{hi:" + RECIPES[id].card.split("\n")[0] + "}\n" + RECIPES[id].card.split("\n").slice(1).join("\n"); }
function learn(id) {
  if (S.recipes[id]) return;

function canMake(id) {

}
function needsText(id) {

function doCook(args) {

}

function jamLeft() { return Math.max(0, 4 - (S.flags.jamTaken || 0)); }

function pocketsText() {
  const keys = Object.keys(S.inv).sort();
  if (!keys.length) return ["Your pockets are empty, apart from fluff."];
  const groups = { "seeds": [], "from the garden": [], "food": [], "fish": [], "things": [], "disks": [] };
  for (const k of keys) {
    const s = "{hi:" + itemName(k, S.inv[k]) + "}";
    if (k.startsWith("seed:")) groups.seeds.push(s);
    else if (k.startsWith("fish:")) groups.fish.push(s);
    else if (k.startsWith("disk:")) groups.disks.push(s);
    else if (CROPS[k]) groups["from the garden"].push(s);
    else if (RECIPES[k] || k === "honey" || k === "jam" || k === "sandwich") groups.food.push(s);
    else groups.things.push(s);
  }
  const out = ["{dim:your pockets (and a basket, and a coat with a lot of pockets):}"];
  for (const [g, list] of Object.entries(groups)) if (list.length) out.push("  {acc:" + pad(g, 16) + "}" + list.join(", "));
  out.push("  {acc:" + pad("logs inside", 16) + "}" + S.wood);
  return out;
}
