/* =====================================================================
   10-fishing.js — sit on the dock, cast, wait, and press enter (or tap)
   the moment the float dips. Different fish come out in different
   weather and at different times. One of them is a legend.
   ===================================================================== */
"use strict";

const FISH = [
  { id: "minnow", w: 18, win: 1400, size: [3, 6], keep: false, when: () => true, line: "A minnow. You put it back." },
  { id: "perch", w: 30, win: 1200, size: [14, 32], when: () => !isNight(), line: "A perch. Green and striped, spines up." },
  { id: "roach", w: 24, win: 1200, size: [12, 28], when: () => true, line: "A roach. Silver, red-finned." },
  { id: "trout", w: 14, win: 850, size: [25, 48], when: () => (isMorning() || isEvening()) && !weatherNow().rain && weatherNow().cloud < 0.6, line: "A brown trout, speckled, heavier than it looks." },
  { id: "pike", w: 7, win: 700, size: [50, 95], when: () => isEvening() || S.min >= 20 * 60, line: "A pike. All teeth. You get it off the hook very carefully." },
  { id: "eel", w: 16, win: 900, size: [40, 80], when: () => isNight() && weatherNow().rain > 0, line: "An eel. It wraps itself round your wrist." },
  { id: "moonperch", w: 14, win: 900, size: [15, 25], when: () => S.day > SEASON_END && isNight() && weatherNow().cloud < 0.5, line: "A perch, but faintly lit from inside. Blue-gold. It fades as you look at it." },
  { id: "marmalade", w: 3, win: 550, size: [90, 90], keep: false, when: () => S.day >= 4 && (weatherNow().fog > 0.5 || (S.min >= 6 * 60 && S.min < 8 * 60)), line: "" },
  { id: "junk:boot", w: 5, win: 1500, size: [0, 0], junk: true, when: () => true, line: "An old boot. A left one." },
  { id: "junk:can", w: 4, win: 1500, size: [0, 0], junk: true, when: () => true, line: "A rusty tin can with a snail in it." },
  { id: "junk:bottle", w: 6, win: 1500, size: [0, 0], junk: true, when: () => !S.flags.gotBottle && S.day >= 2, line: "" }
];
const KEEPERS = FISH.filter(f => !f.junk && f.id !== "minnow" && f.id !== "marmalade" && f.id !== "moonperch").map(f => f.id).concat(["marmalade"]);

function rollFish() {
  // the lake wants you to have the bottle. by the sixth bite, it's yours.
  S.flags.bites = (S.flags.bites || 0) + 1;
  if (!S.flags.gotBottle && S.day >= 2 && S.flags.bites >= 6) return FISH.find(f => f.id === "junk:bottle");
  const pool = FISH.filter(f => f.when());
  let tot = pool.reduce((a, f) => a + f.w, 0), r = Math.random() * tot;
  for (const f of pool) { r -= f.w; if (r <= 0) return f; }
  return pool[0];
}

function waterLine(phase, bob) {
  let a = "", b = "";
  for (let i = 0; i < 14; i++) a += (i + phase) % 5 === 0 ? "-" : "~";
  for (let i = 0; i < 14; i++) b += (i + phase + 2) % 5 === 0 ? "-" : "~";
  const float = bob ? "{warn:!}" : "{acc:" + (phase % 6 < 3 ? "o" : "°") + "}";
  return "    {sky:" + a + "}" + float + "{sky:" + b + "}";
}

async function doFish() {
  if (roomName() !== "dock") return print("You'll want to be on the dock for that. {cmd:cd ~/dock} {dim:(fish don't live in " + roomName() + "s.)}");
  if (!has("rod")) return print("You haven't got a rod. {dim:(Wren's is in the garden shed: {cmd:cd ~/garden/shed})}");
  if (T.cap) return print("you can't fish inside a pipe. you tried, though, and that's what matters.");
  if (weatherNow().rain >= 1 && !has("umbrella")) warm(-3, "cold. wet. you should've brought the duck umbrella.");
  print(pick(["You cast. {acc:plip.}", "The float lands a little short. Fine.", "A good cast, for once."]));
  sfx("plip");
  const d = printRaw(fmt(waterLine(0, false)));
  let early = false;
  T.keyWait = () => { early = true; };
  const waitMs = T.autoFish ? 10 : rand(2200, 6500);
  const t0 = Date.now();
  let phase = 0;
  const musings = ["a heron further down the shore.", "a leaf drifts past the float.", "a dog barks twice across the lake.", "the float bobs. wind.", "a dragonfly lands on the rod.", "the cable at your feet ticks, very faintly."];
  let mused = false;
  while (Date.now() - t0 < waitMs && !early && !T.skip) {
    phase++;
    d.innerHTML = fmt(waterLine(phase, false));
    if (!mused && Date.now() - t0 > 1600 && chance(0.12)) { mused = true; print("{dim:" + pick(musings) + "}"); }
    await wait(180);
  }
  T.keyWait = null;
  if (T.skip) { print("{dim:you reel in. another time.}"); spend(5); return; }
  if (early) {
    spend(5);
    return print(pick(["You strike too early! The float wasn't even moving. The lake seems faintly amused.", "Too eager! You yank the line out of the water with nothing on it. A duck looks away, embarrassed for you.", "Whoops — nothing was biting. Wait for the {warn:!} next time."]) + " {dim:(" + "{cmd:fish}" + " again?)}");
  }
  const f = rollFish();
  d.innerHTML = fmt(waterLine(phase, true));
  sfx("plip");
  print("{warn:!! the float dips — NOW!}  {dim:(enter, space, or tap)}");
  const got = T.autoFish ? true : await new Promise(res => {
    let done = false;
    T.keyWait = () => { if (!done) { done = true; res(true); } };
    setTimeout(() => { if (!done) { done = true; T.keyWait = null; res(false); } }, f.win + (S.warmth > 70 ? 150 : 0));
  });
  T.keyWait = null;
  spend(randi(10, 25));
  if (!got) {
    return print(pick(["Too slow — the float pops back up and whatever it was has gone. You'll get the next one.", "You blink and miss it. The water closes over the spot like nothing happened.", "Gone! Something stole the bait with tremendous skill."]) + " {cmd:fish}");
  }
  sfx("reel");
  await pause(300);
  if (f.id === "marmalade") return catchMarmalade();
  if (f.id === "junk:bottle") return catchBottle();
  const size = randi(f.size[0], f.size[1]);
  print(f.line + (f.size[1] ? " {dim:(" + size + "cm)}" : ""));
  const L = S.fishlog[f.id] || { n: 0, best: 0 };
  const best = size > L.best && L.n > 0;
  L.n++; L.best = Math.max(L.best, size); S.fishlog[f.id] = L;
  if (best) print("{ok:(your biggest " + f.id + " yet!)}");
  if (f.keep !== false) { give(f.junk ? f.id : "fish:" + f.id); }
  if (!f.junk) { S.stats.fish++; keepsake("first_fish"); }
  if (KEEPERS.every(k => S.fishlog[k])) keepsake("fishall");
  if (catHere() && !f.junk && f.keep !== false) print("{dim:Biscuit has materialised at your elbow. She's very interested. Extremely interested. ({cmd:feed biscuit " + f.id + "}?)}");
  remember(f.junk ? "fished up " + itemName(f.id) + ". the lake has a sense of humour." : "caught " + (f.keep === false ? "and released " : "") + "a " + f.id + ".");
}

/* =====================================================================
   11-sky.js — Wren's telescope on the roof. Point it north, south,
   east, west, or straight up. The constellations here aren't the ones
   in books: Wren and Juniper named them when they were fourteen.
   ===================================================================== */
"use strict";

const CONSTELLATIONS = {
  kettle: { dir: "south", name: "The Kettle", art: [
    "            *",
    "     *-----*  \\",
    "     |      \\  *",
    "     *-------*"
  ], note: "Four stars in a squat box with a spout. Always on the boil. In autumn it sits low over the hill, as if someone's about to make tea." },
  cat: { dir: "north", name: "The Sleeping Cat", art: [
    "    *.  .*",
    "     \\`'/     ",
    "     ( *   )___*",
    "      *---------*"
  ], note: "Curled up and turning slowly round the pole star all night. She never actually gets up. Wren said that was the most realistic thing in the sky." },
  spoon: { dir: "north", name: "The Long Spoon", art: [
    "  *",
    "   \\",
    "    *--*--*--*"
  ], note: "For stirring the Kettle. A long handle and a little bowl of three faint stars." },
  heron: { dir: "east", name: "The Heron", art: [
    "        *",
    "        |\\",
    "   *----*  *",
    "        |",
    "        *"
  ], note: "Standing on one leg in the eastern reeds. Rises late, like herons do, and stands very still." },
  bicycle: { dir: "west", name: "Wren's Bicycle", art: [
    "      *--*",
    "     /    \\",
    "   (*)----(*)"
  ], note: "Two bright stars for wheels and a crooked frame. Wren insisted on it. Juniper wanted it to be called 'The Wheelbarrow'. They didn't speak for a week in 1962." },
  lantern: { dir: "up", name: "The Lantern", art: [
    "       _*_",
    "      | * |",
    "      |___|",
    "        *"
  ], note: "Straight overhead in autumn. A small box of stars with one bright one inside. The whole Hollow plans Lantern Night by it." }
};
const DIRS = ["north", "east", "south", "west", "up"];
const cometVisible = () => S.day >= 10 && S.day <= 18;

function starfield(dir, w = 40, h = 7) {
  const r = seeded(dir.length * 977 + dir.charCodeAt(0) * 31 + (S.day > SEASON_END ? 5 : 0));
  const rows = [];
  for (let y = 0; y < h; y++) {
    let s = "";
    for (let x = 0; x < w; x++) { const v = r(); s += v < 0.03 ? "." : v < 0.04 ? "+" : v < 0.045 ? "*" : " "; }
    rows.push(s);
  }
  return rows;
}

function skyCan() {
  if (roomName() !== "roof") return "The telescope's up on the roof. {cmd:cd ~/roof}";
  if (!S.disks.sky) return "The telescope's motor needs its disk. {dim:(SKY.DSK — Juniper has it.)}";
  if (!isNight()) return "It's daytime. You look through the telescope anyway and see a very magnified cloud. {dim:(come back after 8pm.)}";
  const w = weatherNow();
  if (w.rain) return "It's raining. You put the cover back on the telescope before it gets wet. {dim:(the weather's on 93.1.)}";
  if (w.fog > 0.5) return "Fog. The telescope can see about as far as your hand, which you can already see.";
  if (w.cloud > 0.6) return "Nothing but cloud tonight. It's very nice cloud. It's not stars, though.";
  return null;
}

async function doSky(args) {
  const no = skyCan();
  if (no) return print(no);
  let dir = (args[0] || "").toLowerCase();
  if (["n", "e", "s", "w", "u"].includes(dir)) dir = DIRS.find(d => d[0] === dir);
  if (["overhead", "zenith", "straight"].includes(dir)) dir = "up";
  if (!dir) {
    print("You take the cover off the telescope. The motor whirrs as it wakes up.");
    print("{dim:Where to point it?}  " + DIRS.map(d => "{cmd:sky " + d + "}").join("  "));
    const found = Object.keys(S.stars).filter(k => CONSTELLATIONS[k]).length;
    print("{dim:(" + found + "/6 of Wren and Juniper's constellations found. notes: {cmd:cat star_notes.txt})}");
    return;
  }
  if (!DIRS.includes(dir)) return print("The telescope can point " + DIRS.join(", ") + ". Not " + esc(dir) + ".");
  sfx("beep");
  print("{dim:whirrrrr... click.} The telescope swings " + (dir === "up" ? "straight up" : dir) + ".");
  await pause(500);
  // the sky is a grid of [char, colour] cells; constellations get stamped on top
  const field = starfield(dir).map(r => r.split("").map(ch => [ch, ch === " " ? null : "dim"]));
  const here = Object.entries(CONSTELLATIONS).filter(([, c]) => c.dir === dir);
  const stamp = (art, x0, y0, cls) => art.forEach((row, i) => {
    const y = y0 + i;
    if (!field[y]) return;
    for (let x = 0; x < row.length; x++) if (row[x] !== " " && field[y][x0 + x]) field[y][x0 + x] = [row[x], cls];
  });
  here.forEach(([, c], i) => stamp(c.art, 3 + i * 20, 1, "hi"));
  const comet = dir === "west" && cometVisible();
  if (comet) stamp(["*==--- -  -"], 24, 5, "acc");
  print("{dim:   .-" + "-".repeat(40) + "-.}");
  for (const row of field) {
    const s = row.map(([ch, cls]) => (cls ? "{" + cls + ":" + esc(ch) + "}" : " ")).join("");
    print("{dim:  |} " + s + "{dim: |}");
  }
  print("{dim:   '-" + "-".repeat(40) + "-'}");
  for (const [k, c] of here) {
    const first = !S.stars[k];
    S.stars[k] = S.stars[k] || S.day;
    print((first ? "{ok:New!} " : "") + "{hi:" + c.name + "} {dim:— " + c.note + "}");
    if (first) remember("found " + c.name + " through the telescope.");
  }
  if (comet) {
    print("{acc:...and there, low and faint, with a tail like a brushstroke: the comet.}");
    if (!S.flags.sawComet) {
      S.flags.sawComet = true;
      await pause(600);
      await type("You watch it for a long time. It doesn't move, and it's moving at thousands of miles an hour, and you think about two fourteen-year-olds at the end of the dock, sixty-four years ago, seeing exactly this.", 45);
      keepsake("comet");
      clue("comet");
      remember("saw the comet. Juniper and Wren saw it from this exact roof in 1962.");
      if (S.quests.jun_comet === "open") print("{dim:(Juniper will want to know. {cmd:send} her something — anything.)}");
    }
  } else if (dir === "west" && S.day < 10) print("{dim:(nothing unusual in the west tonight. it's quiet. like it's waiting.)}");
  if (Object.keys(CONSTELLATIONS).every(k => S.stars[k])) keepsake("allstars");
  spend(15);
  warm(-2);
}

function starNotes() {
  let out = "{hi:STAR NOTES}  {dim:(Juniper's handwriting, very small and very neat)}\n\n";
  for (const [k, c] of Object.entries(CONSTELLATIONS)) out += (S.stars[k] ? "{ok:✓} {hi:" + c.name + "}" : "{dim:·} " + c.name) + "  {dim:— look " + c.dir + "}\n";
  out += "\n{dim:clear nights only. after 8pm. dress warmly, you won't, but do.}";
  if (S.day >= 10) out += "\n{acc:p.s. comet. west. this week only. J.}";
  return out;
}

/* ---- js/12-commands.js ---- */
/* =====================================================================
   12-commands.js — the shell. Commands register themselves with cmd():

     cmd("name alias1 alias2", "what it does", async (args, ctx) => { ... },
         { group: "living", hidden: false, when: () => true });

   ctx.stdin is an array of lines when something was piped in.
   Supports:  a ; b     a && b     a | b | c     a > file     a >> file
              !!   !3   aliases   tab-completion   "quoted args"
   ===================================================================== */
"use strict";

const CMDS = {};
const ALIAS_OF = {};
function cmd(names, help, fn, o = {}) {
  const [main, ...alts] = names.split(" ");
  CMDS[main] = Object.assign({ name: main, help, fn, group: "other" }, o);
  for (const a of alts) ALIAS_OF[a] = main;
}
const cmdAvailable = n => CMDS[n] && (!CMDS[n].when || CMDS[n].when());
function commandNames() { return Object.keys(CMDS).filter(n => cmdAvailable(n) && !CMDS[n].secret).sort(); }
function findCmd(n) {
  if (CMDS[n] && cmdAvailable(n)) return CMDS[n];
  if (ALIAS_OF[n] && cmdAvailable(ALIAS_OF[n])) return CMDS[ALIAS_OF[n]];
  return null;
}
/** Extra words for tab completion after a command. */
function completeWords(c, pos) {
  c = ALIAS_OF[c] || c;
  const m = {
    brew: Object.keys(TEAS), plant: Object.keys(S.inv).filter(k => k.startsWith("seed:")).map(k => k.slice(5)),
    radio: Object.keys(STATIONS).concat(["off", "scan"]), sky: DIRS, theme: ["amber", "green", "paper", "rose", "frost"],
    send: pos === 2 ? Object.keys(S.inv).map(k => k.replace(/^(fish|junk|disk):/, "").replace(/_/g, " ")) : ["to", "ottoline", "fenn", "pip", "juniper"],
    feed: ["biscuit", "fox"], pet: ["biscuit"], man: commandNames(), help: commandNames(), cook: Object.keys(S.recipes).map(r => r.replace(/_/g, " ")),
    eat: Object.keys(S.inv).map(k => k.replace(/_/g, " ")), insert: Object.keys(S.inv).filter(k => k.startsWith("disk:")).map(k => k.slice(5) + ".dsk"),
    where: ["biscuit"], light: ["lamp", "candle"], cd: Object.keys(ROOMS_SHORT()), sound: ["on", "off"], keys: ["on", "off"]
  };
  return m[c] || [];
}
const ROOMS_SHORT = () => children(HOME);

/* ---------- parsing ---------- */
function splitTop(line, seps) {
  // split on separators outside quotes. returns [{text, sep}]
  const out = []; let cur = "", q = null;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { cur += ch; if (ch === q) q = null; continue; }
    if (ch === '"' || ch === "'") { q = ch; cur += ch; continue; }
    const sep = seps.find(s => line.startsWith(s, i));
    if (sep) { out.push({ text: cur, sep }); cur = ""; i += sep.length - 1; continue; }
    cur += ch;
  }
  out.push({ text: cur, sep: null });
  return out;
}

function expandHistory(line) {
  if (!line.includes("!")) return line;
  const prev = S.hist.slice(0, -1);
  return line.replace(/!!|!(\d+)/g, (m, n) => {
    if (m === "!!") return prev[prev.length - 1] || "";
    return prev[parseInt(n, 10) - 1] || m;
  });
}

async function shell(line) {
  const expanded = expandHistory(line);
  if (expanded !== line) { print("{dim:" + esc(expanded) + "}"); S.hist[S.hist.length - 1] = expanded; }
  S.stats.cmds++;
  const chain = splitTop(expanded, ["&&", ";"]);
  let ok = true;
  for (let i = 0; i < chain.length; i++) {
    const seg = chain[i].text.trim();
    const prevSep = i > 0 ? chain[i - 1].sep : null;
    if (prevSep === "&&" && !ok) continue;
    if (!seg) continue;
    ok = await pipeline(seg);
    if (T.skip && i < chain.length - 1) { T.skip = false; }
  }
}

async function pipeline(seg, depth = 0) {
  // redirect?
  let redirect = null;
  const rm = seg.match(/^(.*?)\s*(>>?)\s*([^\s>|]+)\s*$/);
  if (rm && !/^\s*echo\s*$/.test(rm[1]) && rm[1].trim()) { redirect = { mode: rm[2], file: rm[3] }; seg = rm[1]; }
  const stages = splitTop(seg, ["|"]).map(s => s.text.trim()).filter(Boolean);
  if (stages.length > 1) keepsake("hacker");
  let stdin = null;
  let ok = true;
  for (let i = 0; i < stages.length; i++) {
    const last = i === stages.length - 1;
    const capture = !last || redirect;
    const lines = [];
    if (capture) T.cap = lines;
    try { ok = await runOne(stages[i], stdin, depth); }
    finally { if (capture) T.cap = null; }
    if (capture) stdin = lines;
  }
  if (redirect) {
    const path = resolve(redirect.file);
    const why = path === "/etc/motd" ? null : writable(path);
    if (why) { print("{warn:can't write there —} " + why); return false; }
    const text = (stdin || []).join("\n");
    S.files[path] = redirect.mode === ">>" && S.files[path] ? S.files[path] + "\n" + text : text;
    print("{dim:(wrote " + plural((stdin || []).length, "line") + " to " + esc(shortPath(path)) + ")}");
    keepsake("writer");
  }
  return ok !== false;
}

async function runOne(text, stdin, depth) {
  let w = words(text);
  if (!w.length) return true;
  // aliases
  if (S.aliases[w[0]] && depth < 5) {
    const a = S.aliases[w[0]] + (w.length > 1 ? " " + w.slice(1).join(" ") : "");
    for (const part of splitTop(a, [";", "&&"])) if (part.text.trim()) await pipeline(part.text.trim(), depth + 1);
    return true;
  }
  let name = w[0];
  // ./script
  if (name.startsWith("./") || (name.startsWith("/") && nodeAt(resolve(name)) && nodeAt(resolve(name)).exec)) return execFile(name);
  const c = findCmd(name.toLowerCase());
  if (!c) return notFound(name, w);
  const r = await c.fn(w.slice(1), { stdin, raw: text });
  return r !== false;
}

function notFound(name, w) {
  // natural-ish language: "go to the kitchen", "make tea", "read welcome"
  const l = w.join(" ").toLowerCase();
  if (/^(go|walk|enter|head)\b/.test(l)) return runOne("cd " + w.slice(1).filter(x => !["to", "the", "into", "in"].includes(x.toLowerCase())).join(" "));
  if (/^(make|have|drink)\s+(a\s+)?(cup|tea|pot)/.test(l) || l === "tea") return runOne("brew " + (w.find(x => TEAS[x.toLowerCase()]) || ""));
  if (/^(hi|hello|hey|hiya)\b/.test(l)) { print(pick(["Hello! HEARTH is pleased to see you. (HEARTH can't see.)", "hello. (Biscuit, from somewhere: mrrp.)"])); return true; }
  if (/^(thank|thanks|ty)\b/.test(l)) { print("You're welcome. {dim:(HEARTH blushes, as much as beige can.)}"); return true; }
  if (/^(ok|okay|yes|no|y|n)$/.test(l)) { print("{dim:(HEARTH nods, politely, at nothing in particular.)}"); return true; }
  if (/biscuit|cat/.test(l) && w.length > 1) { print("Biscuit ignores this. {dim:(try {cmd:pet biscuit} or {cmd:feed biscuit}.)}"); return true; }
  const all = Object.keys(CMDS).filter(cmdAvailable).concat(Object.keys(ALIAS_OF).filter(a => cmdAvailable(ALIAS_OF[a])));
  const g = closest(name.toLowerCase(), all, name.length > 4 ? 2 : 1);
  sfx("bonk");
  if (/^[a-z;'\]\[,.]{12,}$/.test(name) && /(.)\1{4,}/.test(name)) { print("hearth: command not found: " + esc(name) + "\n{dim:(that was Biscuit. she walked across the keyboard. she's not sorry.)}"); return false; }
  print("hearth: command not found: {warn:" + esc(name) + "}" + (g ? "   {dim:did you mean} {cmd:" + g + "}{dim:?}" : "   {dim:(try {cmd:help}, or {cmd:hint} if you're stuck)}"));
  return false;
}

/* ---------- moving about ---------- */
const ROOM_NAMES = ["kitchen", "parlour", "study", "garden", "greenhouse", "dock", "cellar", "attic", "roof"];
/** Which rooms open onto which. (cd <room> works from anywhere; this is just what's next door.) */
const DOORS = {
  hall: ["study", "kitchen", "parlour", "cellar", "attic"], study: ["hall"], kitchen: ["hall", "garden", "cellar"],
  parlour: ["hall"], cellar: ["kitchen"], attic: ["hall", "roof"], roof: ["attic"],
  garden: ["kitchen", "greenhouse", "dock"], greenhouse: ["garden"], dock: ["garden"]
};
const doorsOf = r => (DOORS[r] || ["hall"]);
function doCd(args) {
  args = args.filter(x => !["to", "the", "into", "in", "back"].includes(x.toLowerCase()));
  let target = args.join("_") || undefined;
  if (!target || target === "~") target = HOME;
  let path = resolve(target);
  let node = nodeAt(path);
  if (!node) {
    // friendly: "cd kitchen" works from anywhere
    const n = target.replace(/^\.?\/?/, "").replace(/\/$/, "").toLowerCase();
    const syn = { "living_room": "parlour", "lounge": "parlour", "living": "parlour", "office": "study", "lake": "dock", "jetty": "dock", "basement": "cellar", "loft": "attic", "outside": "garden", "yard": "garden", "hall": "", "hallway": "", "home": "" };
    const room = ROOM_NAMES.includes(n) ? n : syn[n] != null ? syn[n] : closest(n, ROOM_NAMES, 2);
    if (room != null && (room === "" || ROOM_NAMES.includes(room))) { path = HOME + (room ? "/" + room : ""); node = nodeAt(path); }
  }
  if (!node) { sfx("bonk"); print("cd: no such place: {warn:" + esc(target) + "}  {dim:(try {cmd:ls} to see what's here, or {cmd:map})}"); return false; }
  if (node.kind !== "dir") { print("cd: " + esc(target) + " isn't a place, it's a thing. {dim:(read it: {cmd:cat " + esc(target) + "})}"); return false; }
  const lock = node.lock && node.lock();
  if (lock) {
    if (path.endsWith("/trunk") && has("key")) { S.flags.trunkOpen = true; print("You fit the little brass key into the padlock. It turns with a satisfying {acc:click}."); }
    else { sfx("bonk"); print(lock); return false; }
  }
  if (path === S.cwd) { print("{dim:you're already here. (very here.)}"); return true; }
  const fromRoom = roomName();
  S.prevCwd = S.cwd; S.cwd = path;
  const toRoom = roomName();
  if (toRoom !== fromRoom) {
    spend(1);
    sfx("door");
    if (["garden", "dock", "roof"].includes(toRoom) && weatherNow().rain >= 1 && !has("umbrella")) print("{dim:(it's chucking it down out here. you could have brought the duck umbrella from the hall.)}"), warm(-2);
    if (toRoom === "attic" && !S.flags.atticSeen && S.flags.atticLit) { S.flags.atticSeen = true; keepsake("attic"); }
    if (toRoom === "greenhouse" && !S.flags.ghSeen) { S.flags.ghSeen = true; keepsake("greenhouse"); }
    print("{dim:" + esc(shortPath(path)) + "}");
    const d = val(node.desc);
    if (d && (!S.flags["seen" + toRoom] || isDark(path))) {
      print(d);
      if (node.room && !isDark(path)) print("{dim:doors:} " + doorsOf(toRoom).map(x => '<span class="cmd" data-c="cd ' + x + '">' + x + "</span>").join("{dim: · }"));
      S.flags["seen" + toRoom] = true;
    }
    if (catHere()) print("{dim:" + catLine() + "}");
    if (toRoom === "garden" && (isNight() || isEvening()) && chance(0.6)) print("{dim:(a fox is sitting at the edge of the long grass, watching you. {cmd:cat fox})}");
    if (isDark(path)) print("{dim:(you'll want some light. {cmd:cd ..} back down.)}");
  }
  return true;
}

function lsLine(name, node, long, dir) {
  const isD = node.kind === "dir";
  const full = (dir && dir !== "/" ? dir : "") + "/" + name;
  const tap = node.exec ? (dir === "/bin" ? name : full) : isD ? "cd " + (dir ? full : name) : "cat " + (dir ? full : name);
  const cls = isD ? "sky" : node.item ? "acc" : node.exec ? "ok" : node.user ? "hi" : "fg";
  const span = "{" + cls + ':<span class="cmd" data-c="' + esc(tap).replace(/"/g, "&quot;") + '">' + esc(name) + (isD ? "/" : node.exec ? "*" : "") + "</span>}";
  if (!long) return span;
  const owner = node.owner || (node.user ? "you" : "wren");
  return "{dim:" + perm(node) + "  " + pad(owner, 7) + padL(sizeOf(node), 6) + "  oct " + padL(Math.min(31, 11 + S.day), 2) + "}  " + span;
}

function doLs(args) {
  const flags = args.filter(a => a.startsWith("-")).join("");
  const all = flags.includes("a"), long = flags.includes("l");
  const targets = args.filter(a => !a.startsWith("-"));
  const path = resolve(targets[0] || ".");
  const node = nodeAt(path);
  if (!node) { print("ls: can't find {warn:" + esc(targets[0]) + "}"); return false; }
  if (node.kind === "file") { print(lsLine(path.split("/").pop(), node, long, path.slice(0, path.lastIndexOf("/")))); return true; }
  const lock = node.lock && node.lock();
  if (lock) { print(lock); return false; }
  if (isDark(path)) { print("It's too dark to see anything in here. {dim:(something rustles. probably fine.)}"); return true; }
  const kids = children(path, all);
  let names = Object.keys(kids).sort((a, b) => (kids[a].kind === kids[b].kind ? a.localeCompare(b) : kids[a].kind === "dir" ? -1 : 1));
  if (all) names = [".", ".."].concat(names), kids["."] = node, kids[".."] = nodeAt(resolve(path + "/..")) || node;
  if (!names.length) { print("{dim:(empty)}"); return true; }
  if (long || T.cap) { for (const n of names) print(long ? lsLine(n, kids[n], true, path) : n); return true; }
  // columns-ish: just space them out
  const cells = names.map(n => (n === "." || n === ".." ? "{dim:" + n + "}" : lsLine(n, kids[n], false, path)));
  let line = "", len = 0;
  const maxw = Math.max(28, Math.floor(($("term") ? $("term").clientWidth : 800) / (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs")) * 0.5 || 11)) - 4);
  for (let i = 0; i < names.length; i++) {
    const w = names[i].length + 4;
    if (len + w > maxw && line) { print(line); line = ""; len = 0; }
    line += cells[i] + "    "; len += w;
  }
  if (line) print(line);
  if (path === HOME && !S.flags.lsHinted) { S.flags.lsHinted = true; print("{dim:(blue things are places — {cmd:cd} into them. orange things you can {cmd:take}. tap anything.)}"); }
  return true;
}

function doCat(args, ctx) {
  if (!args.length) {
    if (ctx.stdin) { for (const l of ctx.stdin) print(esc(l)); return true; }
    print("cat what? {dim:(try {cmd:cat welcome.txt}. or, if you meant the cat: {cmd:pet biscuit})}"); return false;
  }
  for (const a of args) {
    if (["biscuit", "the_cat", "cat"].includes(a.toLowerCase()) && !findHere(a)) { print(catHere() ? catLine() : "Biscuit isn't here. She's in the " + S.cat.room + "."); continue; }
    const path = resolve(a);
    let node = nodeAt(path);
    let p = path;
    if (!node) { const f = findHere(a); if (f) { node = f.node; p = f.path; } }
    if (!node) { print("cat: {warn:" + esc(a) + "}: no such file. {dim:(" + "{cmd:ls}" + " shows what's here.)}"); return false; }
    if (node.kind === "dir") {
      const lock = node.lock && node.lock();
      print(lock || ("{dim:" + esc(a) + " is a place, not a thing. you look in:}\n" + (isDark(p) ? "it's dark." : val(node.desc) || "")));
      if (!lock && !isDark(p)) doLs([a]);
      continue;
    }
    const text = readFile(p);
    sfx("page");
    print(text === "" ? "{dim:(empty. as expected. very calming.)}" : text);
    if (node.item && !T.cap) {
      print("{dim:(you could {cmd:take " + esc(p.split("/").pop()) + "}.)}");
    }
  }
  spend(1);
  return true;
}

function doTake(args) {
  const what = args.join(" ").replace(/^(the|a|an)\s+/, "").trim();
  if (!what) return print("Take what? {dim:(orange things in {cmd:ls} can be taken.)}");
  if (what.startsWith("key")) return takeKey();
  if (isDark(S.cwd)) return print("You fumble about in the dark and find a cobweb. You don't take it.");
  let f = findHere(what.replace(/ /g, "_")) || findHere(what) || findHere(what.split(" ")[0]);
  if (!f && what.includes("/")) { const p = resolve(what); const n = nodeAt(p); if (n) f = { name: p.split("/").pop(), path: p, node: n }; }
  if (!f) {
    // friendly: look one level down, in drawers and bins and tins
    for (const [dn, dnode] of Object.entries(children(S.cwd, true))) {
      const dp = (S.cwd === "/" ? "" : S.cwd) + "/" + dn;
      if (dnode.kind !== "dir" || (dnode.lock && dnode.lock()) || isDark(dp)) continue;
      const g = findHere(what.replace(/ /g, "_"), dp) || findHere(what, dp);
      if (g && g.node.item) { f = g; print("{dim:(from the " + dn.replace(/^\./, "") + ")}"); break; }
    }
  }
  if (!f) {
    if (what === "biscuit" || what === "cat") return print(catHere() ? "You pick Biscuit up. She becomes forty pounds of liquid and pours back onto the floor." : "Biscuit isn't here.");
    return print("You can't see " + esc(what) + " here. {dim:(" + "{cmd:ls -a}" + "?)}");
  }
  const n = f.node;
  if (n.kind === "dir") return print("That's a whole " + f.name + ". It won't fit in your pocket. {dim:(you can {cmd:cd " + f.name + "} into it.)}");
  if (!n.item) {
    return print(pick(["You'd rather leave that where Wren put it.", "That stays here. It belongs here.", "It's not the sort of thing you take. You give it a little pat instead."]));
  }
  if (n.item === "jam") {
    if (!jamLeft()) return print("The rest of the jam is 'for winter'. A label says so. You respect the label.");
    S.flags.jamTaken = (S.flags.jamTaken || 0) + 1; give("jam");
    return print("You take a jar of " + pick(["blackberry", "damson", "plum", "MYSTERY 2019"]) + " jam. {dim:(" + jamLeft() + " left that you're allowed.)}");
  }
  give(n.item, n.count || 1);
  S.taken[f.path] = true;
  spend(1);
  print("Taken: {acc:" + itemName(n.item, n.count || 1) + "}." + (n.item.startsWith("disk:") ? " {dim:(disks go in HEARTH's drive in the study: {cmd:insert " + n.item.slice(5) + ".dsk})}" : n.item === "lamp" ? " {dim:(now {cmd:light lamp}.)}" : n.item === "rod" ? " {dim:(down to the {cmd:cd ~/dock}, then {cmd:fish}.)}" : n.item === "oilcan" ? " {dim:(the greenhouse door is right next to the garden: {cmd:oil greenhouse})}" : ""));
  if (n.item === "seed:lavender") remember("found Wren's hidden seed tin. she really does hide things.");
  return true;
}
function takeKey() {
  if (S.flags.gotKey) return print("You've already got the key.");
  if (!catHere()) return print("The key's on Biscuit's collar, and Biscuit's in the " + S.cat.room + ".");
  if (S.cat.mood < 75 || S.stats.pets < 8 || S.day < 3) {
    S.flags.keyTried = true;
    return print(pick(["You reach for Biscuit's collar. Biscuit reaches for your hand, with teeth. Not yet.", "Biscuit leans away from your hand with an expression that says 'we're not there yet'.", "Biscuit looks at you, then at the key, then at you. 'Earn it,' says her face."]) + "\n{dim:(be kind to her for a while — {cmd:pet biscuit}, {cmd:feed biscuit} — and try again.)}");
  }
  S.flags.gotKey = true; give("key");
  sfx("chime");
  print("You reach for Biscuit's collar, slowly. She lifts her chin and lets you unclip the little brass key, and then headbutts your hand, once, as if to say {acc:'look after it'}.");
  print("{dim:(it's the key to Wren's trunk, in the attic.)}");
  remember("Biscuit let me have the key. i think that means something.");
}

function doLook(args) {

    const w = args.join(" ").toLowerCase();
    if (["biscuit", "cat"].includes(w)) return print(catHere() ? catLine() : "Biscuit isn't here. She's in the " + S.cat.room + ".");
    if (["lake", "water", "down", "into the water", "in the water"].includes(w) && roomName() === "dock") return print(lakeLook());

  print("{hi:" + (roomName() === "hall" ? "The Hall" : cap(roomName())) + "}  {dim:" + esc(shortPath(S.cwd)) + " · " + clock(S.min) + "}");

  if (things.length) print("{dim:here:} " + things.map(([n, x]) => "{" + (x.item ? "acc" : "hi") + ":" + '<span class="cmd" data-c="cat ' + esc(n) + '">' + esc(n) + "</span>}").join("{dim:,} "));
  const node2 = nodeAt(S.cwd);

}

function doHelp(a) {
  if (a[0] && a[0] !== "all") return doMan(a);
  if (a[0] !== "all") {
    const row = (c, d) => "  " + '<span class="cmd" data-c="' + c + '">' + pad(c, 14) + "</span>" + " {dim:" + d + "}";
    print("{hi:the few things you need}  {dim:(tap any of them)}");

      ["cat note.txt", "read or look closely at something"], ["take", "pick something up"], ["pockets", "what you're carrying"],
      ["map", "the house"], ["board", "what you've worked out"], ["hint", "a nudge, if you're stuck"]]) print(row(c, d));
    print("");
    print("{dim:rooms have their own things to do: try them and see. everything else:} {cmd:help all}");
    return;
  }
  const groups = [
    ["around", "getting around"], ["living", "living here"], ["garden", "the garden"], ["people", "people & paper"], ["help", "when stuck"]
  ];
  for (const [g, title] of groups) {
    const list = Object.values(CMDS).filter(c => c.group === g && cmdAvailable(c.name) && !c.secret);
    if (!list.length) continue;

    if (line.trim()) print(line);

  print("{acc:the computer-ish bits}");

  if (line.trim()) print(line);
  print("{dim:pipes (a | b), ; and &&, > and >>, !!, history, tab-completion, aliases. {cmd:man} anything.}");
}

  const lines = [];
  while (true) {
    const l = await ask("  " + padL(lines.length + 1, 2) + "| ");

    if (l.trim() === "." || l.trim() === ":wq" || l.trim() === ":x" || l.trim() === "EOF") break;

  print("{ok:saved.} {dim:" + plural(lines.length, "line") + " in " + esc(shortPath(path)) + ". read it back with {cmd:cat " + esc(name) + "}.}");

function doFind(a) {
  const q = (a.filter(x => !x.startsWith("-"))[0] || "").toLowerCase().replace(/^-name$/, "");
  const name = a.includes("-name") ? (a[a.indexOf("-name") + 1] || "") : q;
  if (!name) return print("find what? {dim:(find jam, find .dsk, find biscuit)}");
  if (["biscuit", "cat"].includes(name.toLowerCase())) return print("/proc/biscuit  {dim:(she's in the " + S.cat.room + ")}");
  const pat = name.replace(/\*/g, "").toLowerCase();
  const hits = [];
  const walk = (p, depth) => {
    if (depth > 6 || hits.length > 40) return;
    const n = nodeAt(p);
    if (!n || n.kind !== "dir" || (n.lock && n.lock()) || isDark(p)) return;
    for (const [k, ch] of Object.entries(children(p, true))) {
      const fp = (p === "/" ? "" : p) + "/" + k;
      if (k.toLowerCase().includes(pat)) hits.push(fp);
      if (ch.kind === "dir" && !fp.startsWith("/bin")) walk(fp, depth + 1);
    }
  };
  walk(HOME, 0);
  if (!hits.length) return print("find: nothing called '" + esc(name) + "'. {dim:(somewhere locked, maybe. or dark.)}");
  for (const h of hits) print('<span class="cmd" data-c="' + (isDir(h) ? "cd " : "cat ") + esc(h) + '">' + esc(h) + "</span>");
}

/* =====================================================================
   13-devtoys.js — the computer-ish commands. You never need any of
   these to finish the game. They're here because they're fun, and
   because Wren was a nerd in 1987 and never stopped.
   ===================================================================== */
"use strict";

const SYS = { group: "system" };

/* ---------- text filters (work on piped input or on files) ---------- */
function inputLines(args, ctx) {
  const files = args.filter(a => !a.startsWith("-"));
  if (ctx.stdin && !files.length) return ctx.stdin;
  const out = [];
  for (const f of files) {
    const t = readFile(resolve(f));
    if (t == null) { print("{warn:" + esc(f) + ": no such file}"); continue; }
    for (const l of String(t).split("\n")) out.push(plain(l));
  }
  return out;
}
const emit = lines => { for (const l of lines) print(esc(l)); };

cmd("grep", "find lines that match (ls | grep txt, grep -r love)", (a, ctx) => {
  const flags = a.filter(x => /^-[a-z]+$/.test(x)).join("");
  const rest = a.filter(x => !/^-[a-z]+$/.test(x));
  const pat = rest.shift();
  if (pat == null) { print("usage: grep [-i -v -n -r] pattern [file]  {dim:(or pipe into it: {cmd:ls | grep txt})}"); return false; }
  let re;
  try { re = new RegExp(pat, flags.includes("i") ? "i" : ""); } catch (e) { re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), flags.includes("i") ? "i" : ""); }
  const hit = l => re.test(l) !== flags.includes("v");
  const show = (l, pre) => print((pre ? "{acc:" + esc(pre) + "}" + "{dim::}" : "") + (T.cap || flags.includes("v") ? esc(l) : esc(l).replace(new RegExp(re.source.replace(/&/g, "&amp;"), re.flags + "g"), m => "{warn:" + m + "}")));
  if (flags.includes("r")) {
    let n = 0;
    const walk = p => {
      const node = nodeAt(p);
      if (!node || (node.lock && node.lock()) || isDark(p)) return;
      if (node.kind === "file") { const t = val(node.text); if (t) plain(t).split("\n").forEach(l => { if (hit(l) && n++ < 60) show(l.trim(), shortPath(p)); }); return; }
      for (const k of Object.keys(children(p, true))) walk((p === "/" ? "" : p) + "/" + k);
    };
    walk(rest[0] ? resolve(rest[0]) : S.cwd);
    if (!n) print("{dim:(nothing.)}");
    return n > 0;
  }
  const lines = inputLines(rest, ctx);
  let n = 0;
  lines.forEach((l, i) => { if (hit(l)) { n++; show(l, flags.includes("n") ? String(i + 1) : ""); } });
  return n > 0;
}, SYS);
cmd("head", "first few lines (head -n 5)", (a, ctx) => { const n = parseInt((a.find(x => /^-?\d+$/.test(x)) || a[a.indexOf("-n") + 1] || "10").replace("-", ""), 10) || 10; emit(inputLines(a.filter(x => !/^-?\d+$/.test(x) && x !== "-n"), ctx).slice(0, n)); }, SYS);
cmd("tail", "last few lines", (a, ctx) => { const n = parseInt((a.find(x => /^-?\d+$/.test(x)) || a[a.indexOf("-n") + 1] || "10").replace("-", ""), 10) || 10; emit(inputLines(a.filter(x => !/^-?\d+$/.test(x) && x !== "-n"), ctx).slice(-n)); }, SYS);
cmd("wc", "count lines, words, letters", (a, ctx) => {
  const L = inputLines(a, ctx);
  const w = L.join(" ").split(/\s+/).filter(Boolean).length, c = L.join("\n").length;
  if (a.includes("-l")) print(String(L.length)); else print(padL(L.length, 6) + padL(w, 7) + padL(c, 8));

    const n = nodeAt(p);
    if (!n || n.kind !== "dir" || (n.lock && n.lock()) || isDark(p) || depth > 2) return;
    const ks = Object.entries(children(p));

    });
  };
  walk(root, "", 0);
}, SYS);

/* ---------- running files ---------- */
async function execFile(name) {
  const p = resolve(name);
  if (p.endsWith("pip_game.sh") && S.files[p] != null) return pipGame();
  const n = nodeAt(p);
  if (!n) { print("no such file: " + esc(name)); return false; }
  if (p.startsWith("/bin/")) return runOne(p.slice(5));
  if (n.kind === "dir") { print(esc(name) + " is a place. {cmd:cd " + esc(name) + "}"); return false; }
  print("permission denied: " + esc(name) + " {dim:(it's a note, not a program. {cmd:cat " + esc(name) + "} it.)}");
  return false;
}

function doMan(a) {
  const n = (a[0] || "").toLowerCase();
  if (!n) return print("What manual page do you want?  {dim:(e.g. {cmd:man fish}, {cmd:man grep}, {cmd:man man})}");
  if (n === "man") return print("{hi:MAN(1)}\n\n{acc:NAME}\n    man — the manual.\n\n{acc:DESCRIPTION}\n    Explains things. Like Wren, but in a fixed-width font.\n\n{acc:BUGS}\n    Will not explain Biscuit. Nothing can.");
  if (["biscuit", "cat(8)"].includes(n)) return print("{hi:BISCUIT(8)}\n\n{acc:NAME}\n    biscuit — orange cat, PID 1\n\n{acc:SYNOPSIS}\n    biscuit [--wherever-she-likes]\n\n{acc:DESCRIPTION}\n    See {cmd:cat ~/kitchen/biscuit_manual.txt}.\n\n{acc:BUGS}\n    Several. All load-bearing.");

/* ---- js/15-scene.js ---- */
/* =====================================================================
   15-scene.js — the window. A tiny pixel painting of Lake Ilse that
   follows the clock and the weather: dawn, dusk, stars, rain, fog,
   snow, the observatory on the far hill, and whatever's on the sill
   in the room you're in. Biscuit too, if she's with you.
   Drawn at a very low resolution and scaled up, so every pixel shows.
   ===================================================================== */
"use strict";

const SC = { cv: null, g: null, w: 120, h: 132, t: 0, drops: [], flakes: [], clouds: [], stars: [], birds: null, last: 0 };

function sceneInit() {
  SC.cv = $("scene");
  if (!SC.cv || !SC.cv.getContext) return;
  SC.g = SC.cv.getContext("2d");
  sceneResize();
  window.addEventListener("resize", sceneResize);
  const r = seeded(42);
  for (let i = 0; i < 70; i++) SC.stars.push({ x: r(), y: r() * 0.55, b: r(), tw: r() * 6 });
  for (let i = 0; i < 6; i++) SC.clouds.push({ x: r() * 1.4 - 0.2, y: 0.05 + r() * 0.3, w: 14 + r() * 22, s: 0.4 + r() * 0.8 });
  requestAnimationFrame(sceneLoop);
}
function sceneResize() {
  const box = SC.cv.getBoundingClientRect();
  if (!box.width) return;
  SC.w = 120;
  SC.h = Math.max(50, Math.round(120 * box.height / box.width));
  SC.cv.width = SC.w; SC.cv.height = SC.h;
}

function sceneLoop(ts) {
  requestAnimationFrame(sceneLoop);
  if (ts - SC.last < 83) return;          // ~12fps is plenty for a window
  const dt = (ts - SC.last) / 1000; SC.last = ts;
  if (document.hidden) return;
  SC.t += Math.min(dt, 0.2);
  try { drawScene(); } catch (e) { /* never let the window break the game */ }
}

/* colour helpers */
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => { const A = hx(a), B = hx(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; };
function px(x, y, w, h, c) { SC.g.fillStyle = c; SC.g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

/** Sky colours across the day: [top, horizon]. */
function skyCols(m) {
  const keys = [
    [0, "#060a1c", "#111a36"], [300, "#0a1030", "#1c2248"], [360, "#2a2a5a", "#d9826a"], [420, "#4a78b8", "#f4c08a"],
    [540, "#5f9bd6", "#bfe0f0"], [960, "#5c94cc", "#cfe3ee"], [1050, "#4a5c9c", "#f0a060"], [1140, "#2c2458", "#c0607a"],
    [1230, "#0d1232", "#2a2450"], [1440, "#060a1c", "#111a36"]
  ];
  m = ((m % 1440) + 1440) % 1440;
  for (let i = 0; i < keys.length - 1; i++) {
    const [a, t1, h1] = keys[i], [b, t2, h2] = keys[i + 1];
    if (m >= a && m <= b) { const t = (m - a) / (b - a); return [mixc(t1, t2, t), mixc(h1, h2, t)]; }
  }
  return ["#060a1c", "#111a36"];
}

function drawScene() {
  const g = SC.g, W = SC.w, H = SC.h, t = SC.t;
  const w = weatherNow();
  const m = S.min % 1440;
  const night = m >= 1230 || m < 330;
  const r = roomName();
  const outside = ["garden", "dock", "roof"].includes(r);
  const win = $("win");
  if (win) win.classList.toggle("outside", outside || r === "cellar");
  const lit = S.flags.lanternLit;
  const horizon = Math.round(H * 0.58);
  const grey = w.cloud * 0.55 + w.fog * 0.3;

  // ---- cellar: no window at all, just the shelf in lamplight ----
  if (r === "cellar") return drawCellar();

  // ---- sky ----
  let [top, hor] = skyCols(m);
  for (let y = 0; y < horizon; y++) {
    let c = mixc(rgbHex(top), rgbHex(hor), y / horizon);
    if (grey > 0) c = mixc(rgbHex(c), night ? "#1a1d26" : "#8a919c", grey);
    px(0, y, W, 1, c);
  }
  // stars
  if ((night || m < 360 || m > 1170) && w.cloud < 0.6) {
    for (const s of SC.stars) {
      const tw = Math.sin(t * 2 + s.tw) * 0.5 + 0.5;
      if (s.b * tw < 0.35) continue;
      px(s.x * W, s.y * horizon, 1, 1, s.b > 0.85 ? "#fff6d8" : "#aab4d8");
    }
    if (cometVisible() && w.cloud < 0.5) { // the comet, low in the west (left)
      const cx = W * 0.18, cy = horizon * 0.42;
      px(cx, cy, 2, 2, "#fff0c0");
      for (let i = 1; i < 12; i++) px(cx + 2 + i, cy - i * 0.35, 1, 1, i < 5 ? "#ffd890" : "#8a7a90");
    }
  }
  // sun / moon on an arc
  const dayT = (m - 360) / (1200 - 360);
  if (dayT > 0 && dayT < 1) {
    const sx = W * (0.1 + dayT * 0.8), sy = horizon - Math.sin(dayT * Math.PI) * horizon * 0.75;
    if (w.cloud < 0.85) { disc(sx, sy, 4, dayT < 0.15 || dayT > 0.85 ? "#ffb070" : "#fff2c0", 0.95 - w.cloud * 0.6); }
  } else {
    const nT = ((m - 1200 + 1440) % 1440) / 600;
    if (nT < 1) {
      const mx = W * (0.15 + nT * 0.7), my = horizon - Math.sin(nT * Math.PI) * horizon * 0.7;
      if (w.cloud < 0.85) { disc(mx, my, 3, "#f0ecd8", 0.9 - w.cloud * 0.5); px(mx + 1, my - 2, 2, 2, mixc(rgbHex(top), "#000000", 0.1)); }
    }
  }
  // clouds
  const cloudCount = Math.round(w.cloud * 6) + 1;
  for (let i = 0; i < cloudCount; i++) {
    const c = SC.clouds[i % SC.clouds.length];
    c.x += c.s * 0.0006 * (1 + w.wind * 3);
    if (c.x > 1.3) c.x = -0.35;
    const cx = c.x * W, cy = c.y * horizon;
    const col = night ? (w.cloud > 0.5 ? "#2a2e3c" : "#1e2236") : mixc("#ffffff", "#8a909c", w.cloud * 0.8);
    blob(cx, cy, c.w, 5 + c.w / 6, col);
  }
  // far hills + observatory (across the lake)
  const hillCol = night ? "#0c1222" : mixc("#30505a", "#6a7a84", grey);
  for (let x = 0; x < W; x++) {
    const hh = 7 + Math.sin(x * 0.07) * 4 + Math.sin(x * 0.19 + 1) * 2 + (x > 70 && x < 100 ? Math.sin((x - 70) / 30 * Math.PI) * 6 : 0);
    px(x, horizon - hh, 1, hh, hillCol);
  }
  const ox = 86, oy = horizon - 18;
  px(ox - 1, oy + 2, 8, 5, night ? "#20283a" : "#d8dcd8");
  disc(ox + 3, oy + 2, 4, night ? "#262e42" : "#eef0ee", 1);
  if (night) px(ox + 3, oy - 1, 1, 4, "#ffd36a");
  // Fenn's hives on the left hill
  if (!night) for (let i = 0; i < 4; i++) px(14 + i * 4, horizon - 10, 2, 2, "#e8e2d0");
  // ---- lake ----
  const lakeTop = mixc(rgbHex(hor), "#0a1830", 0.35), lakeBot = night ? "#04080f" : "#16324a";
  for (let y = horizon; y < H; y++) px(0, y, W, 1, mixc(rgbHex(lakeTop), lakeBot, (y - horizon) / (H - horizon)));
  // shimmer
  const shim = night ? "rgba(200,210,255,0.18)" : "rgba(255,255,255,0.22)";
  for (let i = 0; i < 18; i++) {
    const y = horizon + 2 + ((i * 7.3) % (H - horizon - 4));
    const x = ((i * 37 + t * (6 + i % 3 * 3)) % (W + 20)) - 10;
    px(x, y, 3 + (i % 4), 1, shim);
  }
  // lanterns on the water after Lantern Night (and on the night itself)
  if (lit && (night || m > 1080)) {
    const rr = seeded(7);
    for (let i = 0; i < 22; i++) {
      const lx = rr() * W, ly = horizon + 3 + rr() * (H - horizon) * 0.55;
      const bob = Math.sin(t * 1.4 + i) * 0.6;
      px(lx, ly + bob, 1, 1, "#ffd27a");
      px(lx, ly + 2 + bob, 1, 2, "rgba(255,200,110,0.35)");
    }
  }
  // the occasional heron on the near shore, by day
  if (!night && w.rain === 0 && Math.floor(t / 40) % 3 === 0) heron(10, horizon + 6);
  // birds
  if (!night && !w.rain && (!SC.birds || SC.birds.x > W + 10) && chance(0.004)) SC.birds = { x: -8, y: horizon * (0.2 + Math.random() * 0.3) };
  if (SC.birds) { SC.birds.x += 0.35; const b = SC.birds; for (let i = 0; i < 3; i++) { px(b.x + i * 4, b.y + (i === 1 ? -2 : 0), 1, 1, "#2a2a30"); px(b.x + i * 4 - 1, b.y - 1 + (i === 1 ? -2 : 0), 1, 1, "#2a2a30"); px(b.x + i * 4 + 1, b.y - 1 + (i === 1 ? -2 : 0), 1, 1, "#2a2a30"); } }
  // ---- fog ----
  if (w.fog > 0) {
    for (let i = 0; i < 5; i++) {
      const y = horizon - 12 + i * 9;
      const off = Math.sin(t * 0.2 + i) * 10;
      g.globalAlpha = w.fog * 0.35;
      px(off - 10, y, W + 20, 8, night ? "#3a4050" : "#dfe4e8");
      g.globalAlpha = 1;
    }
  }
  // ---- foreground per room ----
  drawForeground(r, horizon, night);
  // ---- rain / snow ----
  if (w.rain > 0) {
    const n = Math.round(w.rain * 60);
    while (SC.drops.length < n) SC.drops.push({ x: Math.random() * W, y: Math.random() * H, v: 2 + Math.random() * 2 });
    SC.drops.length = n;
    for (const d of SC.drops) {
      d.y += d.v * 1.6; d.x -= d.v * 0.35 * (0.5 + w.wind);
      if (d.y > H) { d.y = -4; d.x = Math.random() * (W + 20); }
      px(d.x, d.y, 1, 3, night ? "rgba(150,170,210,0.45)" : "rgba(220,230,255,0.55)");
    }
    if (!outside) for (let i = 0; i < 8; i++) px((i * 29 + 7) % W, (i * 53 + Math.floor(t * 4) * 3) % H, 1, 2, "rgba(220,235,255,0.35)"); // drops on the glass
  }
  if (w.snow > 0) {
    while (SC.flakes.length < 50) SC.flakes.push({ x: Math.random() * W, y: Math.random() * H, s: 0.2 + Math.random() * 0.5, p: Math.random() * 6 });
    for (const f of SC.flakes) {
      f.y += f.s; f.x += Math.sin(t + f.p) * 0.2;
      if (f.y > H) { f.y = -2; f.x = Math.random() * W; }
      px(f.x, f.y, 1, 1, "#f4f8ff");
    }
  }
  // night: a warm reflection of the room lamp on the glass
  if (night && !outside) { g.globalAlpha = 0.07; px(0, 0, W, H, "#ffb060"); g.globalAlpha = 1; }
}

function rgbHex(c) {
  if (c[0] === "#") return c;
  const m = c.match(/\d+/g).map(Number);
  return "#" + m.slice(0, 3).map(v => v.toString(16).padStart(2, "0")).join("");
}
function disc(cx, cy, r, col, a = 1) {
  SC.g.globalAlpha = a;
  for (let y = -r; y <= r; y++) { const hw = Math.round(Math.sqrt(r * r - y * y)); px(cx - hw, cy + y, hw * 2 + 1, 1, col); }
  SC.g.globalAlpha = 1;
}
function blob(cx, cy, w, h, col) {
  for (let y = 0; y < h; y++) {
    const k = Math.sin((y + 0.5) / h * Math.PI);
    const ww = w * (0.55 + k * 0.45);
    px(cx - ww / 2 + Math.sin(y * 1.7) * 2, cy + y, ww, 1, col);
  }
}
function heron(x, y) {
  const c = "#4a5058";
  px(x, y, 1, 6, c); px(x + 2, y, 1, 6, c);            // legs
  px(x - 1, y - 5, 5, 4, c);                            // body
  px(x + 3, y - 9, 1, 5, c); px(x + 3, y - 10, 3, 1, c); px(x + 6, y - 10, 2, 1, "#c8a040"); // neck, head, beak
}

/** Biscuit, as a loaf, with a tail that flicks. */
function drawCat(x, y, night) {
  const o = "#e08a3c", d = "#b8622a";
  px(x, y - 5, 11, 5, o);                 // loaf body
  px(x + 1, y - 6, 9, 1, o);
  px(x + 7, y - 9, 6, 5, o);              // head
  px(x + 7, y - 11, 2, 2, o); px(x + 11, y - 11, 2, 2, o);   // ears
  px(x + 8, y - 11, 1, 1, "#f0b8a0"); px(x + 12, y - 11, 1, 1, "#f0b8a0");
  for (let i = 0; i < 3; i++) px(x + 2 + i * 3, y - 5, 1, 4, d);   // stripes
  const blink = Math.floor(SC.t * 1.3) % 9 === 0;
  if (night) { px(x + 8, y - 8, 1, 1, blink ? o : "#c8ff6a"); px(x + 11, y - 8, 1, 1, blink ? o : "#c8ff6a"); }
  else { px(x + 8, y - 7, 1, 1, "#4a2a10"); px(x + 11, y - 7, 1, 1, "#4a2a10"); }
  const flick = Math.sin(SC.t * 2.2) > 0.7 ? -1 : 0;
  px(x - 3, y - 2 + flick, 4, 1, o); px(x - 4, y - 3 + flick, 1, 1, o);   // tail
}
function drawFox(x, y) {
  const o = "#d8642a";
  px(x, y - 4, 8, 3, o); px(x + 7, y - 7, 4, 4, o); px(x + 7, y - 8, 1, 1, o); px(x + 10, y - 8, 1, 1, o);
  px(x + 10, y - 5, 2, 1, "#f4e8d8"); px(x - 4, y - 4, 4, 2, o); px(x - 5, y - 4, 1, 1, "#f4e8d8");
  px(x + 1, y - 1, 1, 2, "#3a2418"); px(x + 6, y - 1, 1, 2, "#3a2418");
  px(x + 9, y - 6, 1, 1, "#ffe080");
}

function sill(y, H, W) {
  px(0, y, W, H - y, "#5a3e28");
  px(0, y, W, 1, "#7a5a3c");
  px(0, y + 1, W, 1, "#6b4b31");
}

function drawForeground(r, horizon, night) {
  const W = SC.w, H = SC.h, t = SC.t;
  const sy = H - 9;
  const catOn = catHere();
  if (r === "garden") {
    // grass, a raised bed edge, the fox at dusk
    for (let x = 0; x < W; x++) { const gh = 6 + Math.sin(x * 0.9) * 2 + Math.sin(x * 0.31 + t) * 1; px(x, H - gh, 1, gh, night ? "#14261a" : "#3e6a34"); }
    px(4, H - 10, 40, 4, "#6a4a2c");
    S.plots.slice(0, 3).forEach((p, i) => { if (p.crop) { px(10 + i * 12, H - 14, 1, 4, "#5aa040"); px(9 + i * 12, H - 15, 3, 1, stageOf(p) === 3 ? "#e0a040" : "#6ac050"); } });
    if ((isNight() || isEvening()) && Math.floor(t / 20) % 2 === 0) drawFox(W - 30, H - 3);
    if (catOn) drawCat(56, H - 4, night);
    return;
  }
  if (r === "dock") {
    // dock boards running out, the lantern post
    for (let i = 0; i < 6; i++) px(30 + i * 2, H - 6 - i * 2, W - 60 - i * 4, 2, i % 2 ? "#6b5038" : "#7a5c40");
    const lx = W / 2 + 18, ly = H - 34;
    px(lx, ly, 2, 22, "#2a2420");
    px(lx - 2, ly - 6, 6, 6, "#2a2420");
    if (S.flags.lanternLit) { disc(lx + 1, ly - 3, 6, "#ffcf6a", 0.25 + Math.sin(t * 3) * 0.05); px(lx - 1, ly - 5, 4, 4, "#ffe6a0"); }
    else px(lx - 1, ly - 5, 4, 4, "#3a4450");
    if (catOn) drawCat(36, H - 9, night);
    return;
  }
  if (r === "roof") {
    px(0, H - 8, W, 8, "#3a3030");
    for (let x = 0; x < W; x += 6) px(x, H - 14, 1, 6, "#2a2424");
    px(0, H - 14, W, 1, "#2a2424");
    // telescope
    px(W - 30, H - 24, 2, 16, "#2a2424"); px(W - 34, H - 8, 10, 1, "#2a2424");
    px(W - 40, H - 30, 16, 4, "#c8a050"); px(W - 42, H - 31, 3, 6, "#a88040");
    if (catOn) drawCat(12, H - 8, night);
    return;
  }
  // indoors: a windowsill with things on it
  sill(sy, H, W);
  if (r === "kitchen") {
    // kettle
    px(14, sy - 9, 12, 9, "#eadfc8"); px(16, sy - 11, 8, 2, "#eadfc8"); px(19, sy - 13, 2, 2, "#2e6a4a"); px(26, sy - 7, 4, 2, "#eadfc8"); px(14, sy - 2, 12, 1, "#2e6a4a");
    if (teaWarm()) steam(20, sy - 15);
    // jars
    for (let i = 0; i < 3; i++) { px(70 + i * 9, sy - 8, 6, 8, ["#b8484a", "#7a3a6a", "#d8a040"][i]); px(70 + i * 9, sy - 9, 6, 1, "#e8e0d0"); }
  } else if (r === "parlour") {
    // a candle and the orange glow of the stove from below
    px(20, sy - 8, 3, 8, "#f0e4c0"); px(21, sy - 10, 1, 2, "#ffcf6a");
    if (fireLit()) { SC.g.globalAlpha = 0.18 + Math.sin(t * 6) * 0.04; px(0, sy - 30, W, 30, "#ff8a30"); SC.g.globalAlpha = 1; }
    px(90, sy - 12, 4, 12, "#6a4a8a"); px(95, sy - 10, 4, 10, "#3a6a8a"); px(100, sy - 13, 3, 13, "#8a3a3a");  // books
  } else if (r === "study") {
    px(16, sy - 8, 8, 8, "#d8d0c0"); px(24, sy - 6, 2, 4, "#d8d0c0");   // mug
    if (teaWarm()) steam(19, sy - 11);
    px(84, sy - 4, 20, 4, "#eae4d4"); px(86, sy - 6, 16, 2, "#f4eee0");  // paper stack
  } else if (r === "greenhouse") {
    for (let i = 0; i < 3; i++) {
      const p = S.gh[i];
      const x = 16 + i * 34;
      px(x, sy - 8, 12, 8, "#b8643a"); px(x - 1, sy - 9, 14, 2, "#c8744a");
      if (p.crop) {
        const st = stageOf(p);
        px(x + 5, sy - 9 - st * 3, 2, st * 3 + 1, "#5aa040");
        if (st === 3) disc(x + 6, sy - 13 - 6, 3, p.crop === "moonflower" ? (night ? "#cfe8ff" : "#8aa0b0") : "#e0a040", 1);
      }
    }
  } else if (r === "attic") {
    if (S.flags.atticLit) { disc(100, sy - 6, 5, "#ffcf6a", 0.35); px(98, sy - 8, 4, 8, "#c8a050"); }
  } else if (r === "hall") {
    px(80, sy - 14, 6, 14, "#2a2a2a"); px(78, sy - 15, 10, 1, "#2a2a2a"); px(81, sy - 18, 4, 3, "#e0b040");  // the duck umbrella (sort of)
  }
  if (catOn) drawCat(44, sy, night);
}
function steam(x, y) {
  for (let i = 0; i < 6; i++) {
    const yy = y - ((SC.t * 6 + i * 3) % 14);
    const xx = x + Math.sin(SC.t * 2 + i) * 2;
    SC.g.globalAlpha = 0.5 * (1 - ((SC.t * 6 + i * 3) % 14) / 14);
    px(xx, yy, 1, 2, "#ffffff");
  }
  SC.g.globalAlpha = 1;
}
function drawCellar() {
  const W = SC.w, H = SC.h;
  px(0, 0, W, H, "#120c08");
  disc(W / 2, 8, 22, "#3a2614", 0.6);
  px(W / 2, 0, 1, 8, "#555"); px(W / 2 - 1, 8, 3, 3, "#ffe0a0");
  for (let s = 0; s < 3; s++) {
    const y = 30 + s * 28;
    if (y > H - 10) break;
    px(6, y, W - 12, 2, "#5a3e28");
    for (let i = 0; i < 9; i++) px(10 + i * 11, y - 8, 7, 8, ["#8a2a3a", "#5a2a5a", "#a8503a", "#6a2a2a"][(i + s) % 4]);
  }
  // the humming beige box
  const by = H - 22;
  px(W - 44, by, 34, 18, "#c8bc9c"); px(W - 42, by + 3, 6, 2, Math.floor(SC.t * 2) % 2 ? "#7dff5c" : "#3a8a2a");
  if (catHere()) drawCat(W - 38, by, false);
}

/* =====================================================================
   16-mystery.js — what's in the lake.

   In October 1962, two fourteen-year-olds on the end of the dock
   flashed a torch at a comet three times, and the lake flashed back.
   Wren spent the rest of her life trying to answer it properly: the
   cable, the receiver in the cellar, the nightly log, Lantern Night.
   This autumn the comet comes back. Wren has gone to be on the water
   off Tórshavn with the only other person who's been listening.

   Nothing here is told to the player directly. It's found, pinned to
   the corkboard (`board`), and worked out. The real ending only opens
   if the player knows the comet's name — which the game never says
   outright unless Juniper decides to tell you.
   ===================================================================== */

  "1962": { thread: "1962", title: "October 1962", hint: "Wren kept a diary, somewhere locked", links: ["bottle", "name"],

  comet:  { thread: "1962", title: "The comet", hint: "Juniper knows the sky", links: ["bottle", "name"],
            text: () => "It comes round every sixty-four years. 1962, and now. Low in the west after dark." + (S.flags.sawComet ? " You've seen it." : "") },

            text: () => S.flags.nameKnown ? "Juniper told you. They called the comet {acc:the Lantern Fish}, after what they saw in the water." : "They named the comet after what they saw in the lake. The diary only gives initials: L——— F———." },
  ask:    { thread: "1962", title: "If it asks", hint: "Wren left something in her trunk", links: ["name", "listen"],
            text: () => "Wren: \"if it ever asks you something, answer with its name. you'll know when.\"" }
};
const THREADS = ["the cellar", "the lake", "1962"];

function clue(id) {
  if (!S.clues) S.clues = {};
  if (S.clues[id] || !CLUES[id]) return;
  S.clues[id] = S.day;
  toast("pinned to the board: <b>" + CLUES[id].title + "</b>");
  sfx("page");
  if (!S.flags.boardHinted) { S.flags.boardHinted = true; setTimeout(() => { if (!T.busy) { print("{dim:(you pin it to the corkboard in the study. {cmd:board} to see it.)}"); showLine(true); } }, 50); }
}

function doBoard() {
  const found = S.clues || {};
  const n = Object.keys(found).length, total = Object.keys(CLUES).length;
  print("{hi:THE CORKBOARD}  {dim:cork, drawing pins, red wool · " + n + " of " + total + " pinned}");
  if (!n) { print(""); print("{dim:Nothing pinned yet. Wren's note said to ignore the noise in the cellar.}"); return; }
  for (const th of THREADS) {
    const cards = Object.entries(CLUES).filter(([, c]) => c.thread === th);
    const seen = cards.filter(([k]) => found[k]);
    const near = cards.filter(([k, c]) => !found[k] && c.links.some(l => found[l]));
    if (!seen.length && !near.length) continue;
    print("");
    print("{acc:── " + th + " " + "─".repeat(Math.max(2, 34 - th.length)) + "}");
    for (const [, c] of seen) { print("  {hi:" + c.title + "}"); printRaw(fmt(c.text()), "ind"); }
    for (const [, c] of near) print("  {dim:?  " + c.hint + "}");
  }
  const hidden = Object.entries(CLUES).filter(([k, c]) => !found[k] && !c.links.some(l => found[l])).length;
  if (hidden) { print(""); print("{dim:(and some string going off the edge of the board, to nothing yet.)}"); }
}

/* ---------- the signal ---------- */
const cometNear = () => S.day >= 10 && S.day <= 18;
const asking = () => S.flags.lanternLit && isNight() && !S.flags.answered;
function signalLevel() {
  if (S.flags.answered) return 0.31;
  if (asking()) return 1;
  let s = 0.06 + Math.min(S.day, 14) / 14 * 0.55;
  if (isNight()) s += 0.08;
  if (cometNear()) s += 0.12;
  if (S.day > 18) s *= 0.6;
  return Math.min(0.97, s + (seeded(S.day * 31 + Math.floor(S.min / 30))() - 0.5) * 0.04);
}
const WORDS_LOW = ["kettle", "kettle", "water", "light", "cat", "three"];
const WORDS_HIGH = ["three", "three", "light", "light", "water", "home", "soon"];
function heard(level) {
  const pool = level > 0.5 ? WORDS_HIGH : WORDS_LOW;
  const r = seeded(S.day * 7 + Math.floor(S.min / 20));
  const n = level > 0.6 ? 4 : level > 0.3 ? 3 : 2;
  return Array.from({ length: n }, () => pool[Math.floor(r() * pool.length)]).join(" . ");
}

/** What you see if you look into the water off the dock. */
function lakeLook() {
  const w = weatherNow();
  if (roomName() !== "dock") return "~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~";
  if (!isNight()) return w.fog > 0.5 ? "Grey water going into grey fog." : "Brown-green water, clear for a metre or so, then dark. The cable goes down into it.";
  const lvl = signalLevel();
  if (S.flags.answered) return "The lake is dark and calm. Every so often, far down, something gold turns over, like it's asleep.";
  if (w.rain >= 1 || w.fog > 0.6) return "Black water, rain-pocked. You can't see into it.";
  if (lvl > 0.45 && chance(0.25 + lvl * 0.6)) {
    clue("lights");
    return "Black water. Your own reflection, and the stars.\n\nThen, a long way down — further than the water should go — a light. Blue-gold. It turns slowly, like something looking up, and then it's gone.";
  }
  return "Black water, the stars in it. The cable going down. " + (lvl > 0.3 ? "For a second you think you see something, deep. Probably not." : "Nothing.");
}

/* ---------- listen ---------- */
async function doListen(args) {
  const a = args.join(" ");
  if (/^(-h|--help|help)/.test(a)) {
    print("{hi:listen}  read the receiver in the cellar");
    print("  {cmd:listen}               take a reading");
    print("  {cmd:listen --log}         readings since you arrived");
    print("  listen --reply WORDS   send words back down the cable {dim:(disabled until it asks)}");
    return;
  }
  if (roomName() !== "cellar") return print("listen: the receiver's in the cellar. {dim:({cmd:cd cellar})}");
  clue("listen"); clue("hum");
  if (/^--log/.test(a)) return listenLog();
  const rm = a.match(/^(--reply|-r|reply)\s*(.*)$/);
  if (rm) return doReply(rm[2]);
  const lvl = signalLevel();
  print("{dim:the box clicks. the hum changes pitch, very slightly.}");
  const bar = printRaw("");
  let dots = "";
  for (let i = 0; i < 22; i++) {
    dots += Math.random() < lvl ? ":" : "·";
    bar.innerHTML = fmt("  listening {sky:" + dots + "}");
    await pause(70);
  }
  print("  signal {hi:" + lvl.toFixed(2) + "}" + (lvl > 0.5 ? "  {acc:(strong)}" : lvl > 0.25 ? "  {dim:(rising)}" : ""));
  if (S.flags.answered) { print("  heard: {dim:...}"); print("{dim:(it's quiet now. not gone. resting.)}"); return; }
  if (asking()) {
    await pause(400);
    print("  heard: {acc:three . three . three}");
    await pause(500);
    print("  heard: {warn:NAME ?}");
    await pause(300);
    print("{dim:(the green light on the box has stopped blinking. it's on. it's waiting.)}");
    print("{dim:(listen --reply ...)}");
    S.flags.sawAsk = true;
    return;
  }
  print("  heard: {sky:" + heard(lvl) + "}");
  if (!S.flags.listenedOnce) { S.flags.listenedOnce = true; remember("ran Wren's listen program in the cellar. it said 'kettle'. I don't know what to do with that."); }
}

function listenLog() {
  print("{dim:readings, this month (full log: {cmd:ls /var/log/listen}):}");
  for (let d = Math.max(1, S.day - 9); d <= S.day; d++) {
    const r = seeded(d * 13)();
    const v = Math.min(0.97, 0.06 + Math.min(d, 14) / 14 * 0.55 + (d >= 10 && d <= 18 ? 0.12 : 0) + r * 0.05);
    print("  " + pad(dateStr(d).toLowerCase(), 12) + " " + "{sky:" + "▮".repeat(Math.round(v * 20)) + "}" + "{dim:" + "·".repeat(20 - Math.round(v * 20)) + "} " + v.toFixed(2));
  }
  clue("log");
}

async function doReply(words) {
  const w = (words || "").toLowerCase().replace(/[^a-z]/g, "");
  if (!w) return print("reply with what? {dim:(listen --reply WORDS)}");
  if (!asking()) {
    sfx("bonk");
    return print("listen: reply disabled. {dim:(hearth.conf: reply = disabled  # until it asks)}");
  }
  if (!["lanternfish", "thelanternfish"].includes(w)) {
    S.flags.wrongReplies = (S.flags.wrongReplies || 0) + 1;
    print("{dim:you send it.} The hum holds the same note, patient. That wasn't it.");
    if (S.flags.wrongReplies >= 2) print("{dim:(Wren: \"answer with its name.\" the name of what? what did they see, in 1962? the board might help: {cmd:board})}");
    return;
  }
  await trueEnding();
}

/* ---------- the other ending ---------- */
async function trueEnding() {
  T.ending = true;
  S.flags.answered = true;
  clue("name");
  print("You type it in, slowly, and press enter.");
  await pause(900);
  print("");
  print("{dim:the hum stops.}");
  await pause(1600);
  await type("For a second there's no sound in the cellar at all. Then the box gives three short clicks, and the green light goes out.", 38);
  await pause(800);
  await type("You go up the cellar steps, through the kitchen, out of the back door, down through the wet grass in your socks.", 38);
  await pause(800);
  await type("The boats are still out. Nobody's talking.", 38);
  await pause(1000);
  print("");
  const W2 = 46;
  const box = printRaw("");
  for (let f = 0; f <= 14; f++) {
    const rows = [];
    rows.push("{dim:" + " .    *        .      *   " + "{acc:*==--- -  -}" + "      .  }");
    rows.push("{dim:        ___/^\\___         _/o\\_              }");
    let boats = "", water = "", deep = "", deeper = "";
    for (let i = 0; i < W2; i++) {
      boats += i % 5 === 2 ? "{acc:o}" : " ";
      water += "{sky:~}";
      const lit = Math.abs(((i + f * 3) % W2) - W2 / 2) < f * 1.6;
      deep += lit && (i + f) % 3 === 0 ? "{acc:*}" : lit ? "{hi:.}" : " ";
      deeper += lit && (i * 7 + f) % 5 === 0 ? "{acc:°}" : " ";
    }
    rows.push(boats, water, deep, deeper);
    box.innerHTML = rows.map(r => fmt(r)).join("<br>");
    scrollDown();
    if (f % 3 === 0) sfx("tick");
    await pause(T.skip ? 0 : 280);
  }
  print("");
  await type("The whole bay is lit from underneath. Blue-gold, from the deep part out to the reeds, thousands of small lights, and all of them moving the same way, slowly, like a shoal.", 38);
  await pause(800);
  await type("They turn once under the boats. Somebody — Pip — makes a sound that isn't a word.", 38);
  await pause(800);
  await type("Then they go down, together, and the lake is dark, and the comet is still there over the hill.", 38);
  await pause(1500);
  print("");
  print("{hi:JUNIPER} {dim:(across the water, from the observatory, not shouting, but you hear it):} ...Oh, Wren.");
  await pause(1600);
  print("");
  await type("Back in the house, the radio in the study has come on by itself. It's on a shortwave band you've never tuned to. Someone's speaking, through a lot of static.", 38);
  sfx("beep");
  await pause(900);
  print("{acc:WREN:} {dim:(kshhh)} ...hear me? It's Wren. Is that you, at the house?");
  await pause(1300);
  print("{acc:WREN:} We saw it from here. Ása and me, in her boat, off Tórshavn. The whole harbour lit up. Every light in the water, all at once.");
  await pause(1500);
  print("{acc:WREN:} Sixty-four years I've been trying to say the right thing to it. {dim:(she's laughing, or crying, or both.)} You worked it out.");
  await pause(1500);
  print("{acc:WREN:} I'll be home on the second. Leave the lantern lit. And — thank you, love. Really.");
  await pause(1200);
  print("{dim:(kshhhhh)}");
  await pause(1800);
  print("");
  print("{hi:              ~  THE END  ~}");
  print("");
  endStats();
  print("");
  print("{dim:   the comet goes. the season turns. the cottage is yours for as long as you like.}");
  keepsake("answered");
  S.flags.metAsa = true;
  remember("answered it. the whole lake lit up. Wren heard it from the Faroes. I don't have words for it yet.");
  S.mailbox.push("wren_home"); S.letters.push("wren_home");
  T.ending = false;
  save();
}

function endStats() {
  const keeps = Object.keys(S.keeps).length;
  const st = [
    ["days in the cottage", S.day], ["cups of tea", S.stats.teas], ["fish caught", S.stats.fish], ["things grown", S.stats.harvests],
    ["parcels sent", S.stats.gifts], ["pinned to the board", Object.keys(S.clues || {}).length + "/" + Object.keys(CLUES).length], ["keepsakes in the jar", keeps + "/" + Object.keys(KEEPSAKES).length]
  ];
  for (const [k, v] of st) print("   {dim:" + pad(k, 24, ".") + "} {acc:" + v + "}");
}

/* ---------- the files ---------- */
const DIARY_1962 = `{dim:(a school exercise book, water-stained. "WREN ASHDOWN, 3B" on the cover.)}

{acc:25 oct 1962.}

J. and me on the end of the dock, gone midnight, freezing.
the comet low over the hill with its tail out behind it like
a fin.

J. flashed her torch at it three times, as a joke.

then the lake flashed back. three times. from under the water,
blue-gold, deep down where the deep bit is. then the whole bay
lit up, like a shoal of lamps, all swimming the same way. it
went round once under the dock and then it went down.

we named the comet after what we saw. J. made me swear not
to write the name down, so I'm only putting the letters:

    {hi:the L——— F———}

we're not telling anyone. ever.`;

function mysteryTree() {
  // a hidden file in the hall: Wren's .plan
  ROOT.kids.cottage.kids[".plan"] = F(`{dim:(~/.plan — last edited 11 oct)}

  - ferry from Aberdeen on the 9th
  - meet Á. at last. thirty-eight years of tuesdays.
  - be on the water off Tórshavn on the 25th, when it comes back
  - don't tell them about the noise. let them find it.`, { owner: "wren", onRead: () => { clue("tor"); S.flags.planRead = true; } });

  const days = () => {
    const k = {};
    for (let d = 1; d < S.day; d++) {
      const r = seeded(d * 13)();
      const v = Math.min(0.97, 0.06 + Math.min(d, 14) / 14 * 0.55 + (d >= 10 && d <= 18 ? 0.12 : 0) + r * 0.05);
      k[dateStr(d).toLowerCase().replace(" ", "-") + ".log"] = F(() => "night of " + dateStr(d) + "\n  max " + v.toFixed(2) + "\n  heard: " + (v > 0.5 ? "three . light . three" : "kettle . water") + (d === S.day - 1 && d >= 10 ? "\n  {dim:(comet visible)}" : ""), { owner: "hearth" });
    }
    return k;
  };
  return {
    var: D("variable things.", {
      log: D("logs.", {
        listen: D("Wren's receiver log. One file a night.", () => Object.assign({
          "README": F(W("every night since may 1987. 0.00 would mean nothing's there.\nit has never read 0.00."), { onRead: () => clue("log") }),
          "1987-2025.summary": F(`{dim:yearly peaks}

  1987   0.11   {dim:first year. it spiked on the 25th. I'd lit a lantern.}
  1988   0.12   {dim:second station on the same signal from march. TÓR. faroes.}
  1991   0.12   {dim:"TÓR" is a woman called Ása. we talk tuesdays. in numbers, mostly.}
  1999   0.13   {dim:every 25th, the same. the more lanterns, the higher.}
  2010   0.14
  2025   0.15   {dim:next year it comes back. 0.15 is the most it's been.}
  ...
  {dim:every single peak is on the 25th of october. Lantern Night.}`, { onRead: () => { clue("log"); clue("tor"); clue("origin"); } })
        }, days()))
      })
    })
  };
}

/* ---------- commands ---------- */
cmd("board corkboard clues notes", "the corkboard: what you've worked out", () => doBoard(), { group: "help" });

/* =====================================================================
   99-boot.js — switching it on. The BIOS checks the kettle, asks your
   name, and lets you in. After that it just keeps time.
   ===================================================================== */
"use strict";

const LOGO = [
  " _  _ ___   _   ___ _____ _  _ ",
  "| || | __| /_\\ | _ \\_   _| || |",
  "| __ | _| / _ \\|   / | | | __ |",
  "|_||_|___/_/ \\_\\_|_\\ |_| |_||_|"
];
async function bootSequence(reboot) {
  $("screen").classList.remove("off");
  $("screen").classList.add("boot");
  sfx("boot");
  T.busy = true;
  showLine(false);
  const fresh = !S.name;
  await pause(300);
  print("{dim:HEARTH-80 · 640K · receiver: on}");
  if (reboot) {
    await pause(300);
    for (const l of LOGO) print("{acc:" + esc(l) + "}");
  }
  print("");
  if (fresh) {
    await pause(400);
    let name = "";
    print("{dim:(type your name and press enter)}");
    while (!name) {
      const got = await ask("login: ");
      name = (got || "").trim().replace(/[^\p{L}\p{N} _'.-]/gu, "").slice(0, 18);
      if (name.toLowerCase() === "biscuit") { print("{dim:(no.)}"); name = ""; }
    }
    S.name = name;
    S.min = 6 * 60 + 10;
    S.cwd = "/cottage/study";
    S.cat.room = "study";
    clearScreen();
    // whatever Wren left on the screen is still there
    const last = [
      "{dim:── last session: wren · 11 oct · 11:48pm ──────────}",
      "{dim:wren@hearth:~/cellar$} listen",
      "{dim:  listening} {sky:··:····:···:··} {dim:signal 0.07}",
      "{dim:  heard:} {sky:kettle . three}",
      "{dim:wren@hearth:~/cellar$} listen",
      "{dim:  listening} {sky:·:···::···:·:·} {dim:signal 0.08}",
      "{dim:  heard:} {sky:three . three}",
      "{dim:wren@hearth:~/cellar$} echo \"don't tell them about the noise. let them find it.\" >> ~/.plan",
      "{dim:wren@hearth:~/cellar$} logout",
      "{dim:─────────────────────────────────────────────────}"
    ];
    for (const l of last) { print(l); await pause(60); }
    print("");
    await pause(600);
    await type("Ten past six. You couldn't sleep. When you came down the computer was already on, and the cat was sitting next to it like she'd been waiting.", 70);
    await pause(250);
    await type("There's an envelope propped against the screen. Somewhere below the floor, something is humming.", 70);
    print("");
    print("  {cmd:cat note.txt}    {cmd:look}");
    print("");
    print("{dim:(tap anything underlined, or type it. {cmd:help} if you're stuck.)}");
    S.mailbox = []; S.letters = [];
    deliverMail();
    remember("arrived at the cottage. couldn't sleep. the computer was already on.");
  } else {
    print("{hi:" + esc(S.name) + "}{dim:, " + clock(S.min) + ", " + dayName(S.day) + " " + dateStr(S.day) + ". " + weatherNow().word + ". you're in the " + roomName() + ".}");
    if (S.mailbox.length) print("{acc:post:} {cmd:mail}");
  }
  print("");
  T.busy = false;
  afterCommand();
  showLine(true);
  focusInput();
}

function main() {
  load();
  buildTree();
  applyTheme();
  termInit();
  sceneInit();
  updatePostit();
  updateCard();
  $("postit").addEventListener("click", () => { if (!T.busy && S.name) runTyped("hint"); });
  // the browser only allows sound after you've touched or typed something
  const wake = () => audioWake();
  document.addEventListener("pointerdown", wake);
  document.addEventListener("keydown", wake);
  setInterval(() => {
    worldTick();
    ambience();
    updateCard();
    if (S.name && !T.busy) setKeys(contextKeys());
  }, 1000);
  setInterval(() => { if (S.name) save(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); lastTick = Date.now(); });
  window.addEventListener("pagehide", save);
  setTimeout(() => bootSequence(false), 350);
}

if (typeof window !== "undefined" && !window.HEARTH_NO_BOOT) {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", main);
  else main();
}
