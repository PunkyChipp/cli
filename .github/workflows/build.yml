name: Build

# Plays the whole season headlessly and checks the single-file build in docs/
# is up to date with web/.

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in web/js/*.js; do node --check "$f"; done
      - name: Play the whole season
        run: node tools/smoke.js
      - name: Build is up to date
        run: |
          node tools/build.js
          git diff --exit-code -- docs || (echo "::error::run 'npm run build' and commit the result" && exit 1)
